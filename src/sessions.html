        const errorRow = document.createElement('div');
        errorRow.className = 'workspace-tree-empty';
        errorRow.style.color = '#ff8a8a';
        errorRow.textContent = snapshot.error;
        container.appendChild(errorRow);
        return;
      }

      snapshot.entries.forEach((entry) => {
        const row = createWorkspaceTreeRow(nodeEntry, state, entry, depth);
        container.appendChild(row);

        if (entry.kind === 'directory' && state.expandedPaths.has(entry.relativePath)) {
          const children = document.createElement('div');
          children.className = 'workspace-tree-children';
          container.appendChild(children);
          renderWorkspaceTreeDirectory(nodeEntry, state, children, entry.relativePath, depth + 1);
        }
      });
    }

    /**
     * Create a simple tree empty-state node.
     *
     * @param {string} text
     * @returns {HTMLDivElement}
     */
    function createTreeEmptyState(text) {
      const empty = document.createElement('div');
      empty.className = 'workspace-tree-empty';
      empty.textContent = text;
      return empty;
    }

    /**
     * Handle host-level keyboard shortcuts for the workspace tree.
     *
     * @param {KeyboardEvent} event
     * @returns {void}
     */
    function handleWorkspaceTreeKeydown(event) {
      const activeKey = activeWorkspaceTreeKey;
      const state = activeKey ? WORKSPACE_TREE_STATE.get(activeKey) : null;
      if (!state || !state.cwd) return;

      const target = event.target;
      const isTextField = target && (
        target.tagName === 'INPUT'
        || target.tagName === 'TEXTAREA'
        || target.isContentEditable
      );
      if (isTextField && event.key !== 'Escape') return;
      if (workspaceTreeMenuEl) return;

      const selection = getWorkspaceTreeSelection(state);
      const hasSelection = !!selection.relativePath;
      const isMeta = !!event.metaKey;
      const isAlt = !!event.altKey;
      const key = String(event.key || '').toLowerCase();

      const run = async (task) => {
        event.preventDefault();
        event.stopPropagation();
        await task();
      };

      if (isMeta && !isAlt && key === 'x' && hasSelection) {
        void run(() => runWorkspaceTreeClipboardOperation(findWorkspaceTreeNodeEntry(state), state, 'cut', selection.relativePath));
        return;
      }

      if (isMeta && !isAlt && key === 'c' && !event.shiftKey && hasSelection) {
        void run(() => runWorkspaceTreeClipboardOperation(findWorkspaceTreeNodeEntry(state), state, 'copy', selection.relativePath));
        return;
      }

      if (isMeta && !isAlt && key === 'v') {
        void run(() => runWorkspaceTreePasteOperation(findWorkspaceTreeNodeEntry(state), state, resolveWorkspaceTreePasteTarget(state)));
        return;
      }

      if (isMeta && isAlt && !event.shiftKey && key === 'c' && hasSelection) {
        void run(() => runWorkspaceTreeCopyPath(findWorkspaceTreeNodeEntry(state), state, selection.relativePath, 'relative'));
        return;
      }

      if (isMeta && isAlt && event.shiftKey && key === 'c' && hasSelection) {
        void run(() => runWorkspaceTreeCopyPath(findWorkspaceTreeNodeEntry(state), state, selection.relativePath, 'absolute'));
        return;
      }

      if (isMeta && key === 'backspace' && hasSelection) {
        void run(() => runWorkspaceTreeDeleteOperation(findWorkspaceTreeNodeEntry(state), state, selection.relativePath));
        return;
      }

      if (key === 'enter' && hasSelection) {
        void run(() => runWorkspaceTreeRenameOperation(findWorkspaceTreeNodeEntry(state), state, selection.relativePath));
      }
    }

    /**
     * Resolve the active workspace node entry for one tree state.
     *
     * @param {object} state
     * @returns {object}
     */
    function findWorkspaceTreeNodeEntry(state) {
      return workspaceNodeMap.get(state.workspaceKey) || createWorkspaceNodes();
    }

    window.addEventListener('keydown', handleWorkspaceTreeKeydown, true);

    /**
     * Render the empty-state placeholder.
     *
     * @returns {void}
     */
    function renderEmptyState() {
      const empty = document.createElement('div');
      empty.className = 'empty-hint';
      empty.textContent = 'No active workspaces';
      listEl.replaceChildren(empty);
    }

    /**
     * Create the persistent node bundle for a workspace row.
     *
     * @returns {{row: HTMLDivElement, threadsContainer: HTMLDivElement, workspaceNameEl: HTMLDivElement, activeBadgeEl: HTMLSpanElement, actions: HTMLDivElement, nameText: HTMLSpanElement, deleteBtn: HTMLButtonElement, createProcessBtn: HTMLButtonElement, threadRenderKey: string, progressExpanded: boolean}}
     */
    function createWorkspaceNodes() {
      const row = document.createElement('div');
      row.className = 'workspace-row';
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      row.setAttribute('aria-expanded', 'false');

      const folderIcon = createIconNode(WORKSPACE_ICON, 'folder-icon');
      const workspaceNameEl = document.createElement('div');
      workspaceNameEl.className = 'workspace-name';
      const nameText = document.createElement('span');
      const activeBadgeEl = document.createElement('span');
      activeBadgeEl.style.cssText = 'font-size:9px; background: var(--accent); color: white; padding: 1px 4px; border-radius: 3px; margin-left: 6px; vertical-align: middle; opacity: 0.8;';
      activeBadgeEl.textContent = 'ACTIVE';
      activeBadgeEl.hidden = true;
      workspaceNameEl.append(nameText, activeBadgeEl);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const deleteBtn = createActionButton('Delete Workspace', DELETE_WORKSPACE_ICON, 'delete');
      const createProcessBtn = createActionButton('Create Process', CREATE_PROCESS_ICON, 'process');
      actions.append(deleteBtn, createProcessBtn);

      row.append(folderIcon, workspaceNameEl, actions);

      const threadsContainer = document.createElement('div');
      threadsContainer.className = 'threads-container';

      const expandedShell = document.createElement('div');
      expandedShell.className = 'workspace-expanded-shell';

      const treePanel = document.createElement('div');
      treePanel.className = 'workspace-tree-panel';

      const treeToolbar = document.createElement('div');
      treeToolbar.className = 'workspace-tree-toolbar';

      const treeNewFileBtn = document.createElement('button');
      treeNewFileBtn.type = 'button';
      treeNewFileBtn.className = 'workspace-tree-toolbar-button';
      treeNewFileBtn.textContent = 'New File';

      const treeNewFolderBtn = document.createElement('button');
      treeNewFolderBtn.type = 'button';
      treeNewFolderBtn.className = 'workspace-tree-toolbar-button';
      treeNewFolderBtn.textContent = 'New Folder';

      const treeRefreshBtn = document.createElement('button');
      treeRefreshBtn.type = 'button';
      treeRefreshBtn.className = 'workspace-tree-toolbar-button';
      treeRefreshBtn.textContent = 'Refresh';

      treeToolbar.append(treeNewFileBtn, treeNewFolderBtn, treeRefreshBtn);

      const treeViewport = document.createElement('div');
      treeViewport.className = 'workspace-tree-viewport';

      const treeFooter = document.createElement('div');
      treeFooter.className = 'workspace-tree-footer';

      treePanel.append(treeToolbar, treeViewport, treeFooter);

      const threadPanel = document.createElement('div');
      threadPanel.className = 'workspace-thread-panel';

      const documentPanel = document.createElement('div');
      documentPanel.className = 'workspace-document-host';

      const activityPanel = document.createElement('div');
      activityPanel.className = 'workspace-activity-panel';

      threadPanel.append(documentPanel, activityPanel);
      expandedShell.append(treePanel, threadPanel);
      threadsContainer.appendChild(expandedShell);

      return {
        row,
        threadsContainer,
        expandedShell,
        treePanel,
        treeToolbar,
        treeViewport,
        treeFooterEl: treeFooter,
        treeNewFileBtn,
        treeNewFolderBtn,
        treeRefreshBtn,
        documentPanel,
        activityPanel,
        threadPanel,
        workspaceNameEl,
        activeBadgeEl,
        actions,
        nameText,
        deleteBtn,
        createProcessBtn,
        threadRenderKey: '',
        progressExpanded: false,
        treeRenderQueued: false,
        documentUi: null,
        workspaceKey: '',
        cwd: '',
      };
    }

    /**
     * Build a stable key for one workspace task card.
     *
     * @param {object | null | undefined} taskView
     * @param {boolean} progressExpanded
     * @returns {string}
     */
    function buildTaskRenderKey(taskView, progressExpanded) {
      return JSON.stringify({ taskView: taskView || null, progressExpanded });
    }

    /**
     * Append lightweight inline markdown into a container.
     *
     * @param {HTMLElement} container
     * @param {string} value
     * @returns {void}
     */
    function appendInlineMarkdown(container, value) {
      const text = String(value || '');
      const tokenPattern = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*)/g;
      let lastIndex = 0;
      let match;

      while ((match = tokenPattern.exec(text)) !== null) {
        if (match.index > lastIndex) {
          container.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        }

        const token = match[0];
        let node;
        if (token.startsWith('`')) {
          node = document.createElement('code');
          node.className = 'task-inline-code';
          node.textContent = token.slice(1, -1);
        } else if (token.startsWith('**')) {
          node = document.createElement('strong');
          node.textContent = token.slice(2, -2);
        } else {
          node = document.createElement('em');
          node.textContent = token.slice(1, -1);
        }

        container.appendChild(node);
        lastIndex = match.index + token.length;
      }

      if (lastIndex < text.length) {
        container.appendChild(document.createTextNode(text.slice(lastIndex)));
      }
    }

    /**
     * Detect compact file-change progress text and extract pill metadata.
     *
     * @param {string} value
     * @returns {{ kind: string, target: string, ref: string, stats: string[] } | null}
     */
    function parseProgressChangeMeta(value) {
      const text = String(value || '').trim();
      const kindMatch = text.match(/^(Edited|Analyzed|Created|Updated|Removed|Patched|Changed)\s+(.+)$/i);
      if (!kindMatch) return null;

      const kind = kindMatch[1].trim();
      let remainder = kindMatch[2].trim();
      const stats = remainder.match(/[+-]\d+/g) || [];
      remainder = remainder.replace(/[+-]\d+/g, '').trim();

      let ref = '';
      const refMatch = remainder.match(/(#L\d+(?:-\d+)?)$/i);
      if (refMatch) {
        ref = refMatch[1].trim();
        remainder = remainder.slice(0, -ref.length).trim();
      }

      if (!remainder) return null;

      return {
        kind,
        target: remainder,
        ref,
        stats,
      };
    }

    /**
     * Build a compact pill for file-change style progress updates.
     *
     * @param {{ kind: string, target: string, ref: string, stats: string[] }} meta
     * @returns {HTMLDivElement}
     */
    function createProgressChangePill(meta) {
      const pill = document.createElement('div');
      pill.className = 'task-progress-pill';

      const kind = document.createElement('span');
      kind.className = 'task-progress-pill-kind';
      kind.textContent = meta.kind;
      pill.appendChild(kind);

      const target = document.createElement('code');
      target.className = 'task-progress-pill-target';
      target.textContent = meta.target;
      pill.appendChild(target);

      if (meta.ref) {
        const ref = document.createElement('span');
        ref.className = 'task-progress-pill-ref';
        ref.textContent = meta.ref;
        pill.appendChild(ref);
      }

      if (Array.isArray(meta.stats) && meta.stats.length > 0) {
        const stats = document.createElement('span');
        stats.className = 'task-progress-pill-stats';
        meta.stats.forEach((stat) => {
          const value = document.createElement('span');
          value.className = `task-progress-pill-stat ${stat.startsWith('-') ? 'is-minus' : 'is-plus'}`;
          value.textContent = stat;
          stats.appendChild(value);
        });
        pill.appendChild(stats);
      }

      return pill;
    }

    /**
     * Render a progress row with compact fallback layout.
     *
     * @param {string} value
     * @param {number} index
     * @returns {HTMLDivElement}
     */
    function renderProgressItem(value, index) {
      const row = document.createElement('div');
      row.className = 'task-progress-item';
      row.appendChild(createTaskMarker('progress', index));

      const meta = parseProgressChangeMeta(value);
      if (meta) {
        row.appendChild(createProgressChangePill(meta));
        return row;
      }

      const content = document.createElement('div');
      content.className = 'task-progress-content';

      const text = document.createElement('div');
      text.className = 'task-progress-text';
      appendInlineMarkdown(text, value);
      content.appendChild(text);

      row.appendChild(content);
      return row;
    }

    /**
     * Create one simple text row with inline markdown support.
     *
     * @param {string} className
     * @param {string} value
     * @returns {HTMLDivElement}
     */
    function createMarkdownTextRow(className, value) {
      const line = document.createElement('div');
      line.className = className;
      appendInlineMarkdown(line, value);
      return line;
    }

    /**
     * Create one marker node for a task list item.
     *
     * @param {'checklist' | 'ordered' | 'unordered' | 'progress'} style
     * @param {number} index
     * @param {boolean} checked
     * @returns {HTMLDivElement}
     */
    function createTaskMarker(style, index = 0, checked = false) {
      const marker = document.createElement('div');

      if (style === 'progress') {
        marker.className = 'task-progress-marker';
        marker.textContent = String(index + 1);
        return marker;
      }

      if (style === 'checklist') {
        marker.className = `task-rich-marker task-rich-marker-check${checked ? ' is-checked' : ''}`;
        marker.textContent = checked ? '✓' : '';
        return marker;
      }

      if (style === 'ordered') {
        marker.className = 'task-rich-marker task-rich-marker-order';
        marker.textContent = String(index + 1);
        return marker;
      }

      marker.className = 'task-rich-marker-bullet';
      return marker;
    }

    /**
     * Render one structured markdown list block.
     *
     * @param {object} block
     * @returns {HTMLDivElement}
     */
    function renderMarkdownListBlock(block) {
      const list = document.createElement('div');
      list.className = 'task-rich-list';

      block.items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'task-rich-list-item';
        row.appendChild(createTaskMarker(block.style, index, !!item.checked));

        const text = document.createElement('div');
        text.className = 'task-rich-list-item-text';
        appendInlineMarkdown(text, item.text || item.value || '');
        row.appendChild(text);
        list.appendChild(row);
      });

      return list;
    }

    /**
     * Render one structured markdown block.
     *
     * @param {object} block
     * @returns {HTMLElement}
     */
    function renderMarkdownBlock(block) {
      if (block.type === 'alert') {
        const alert = document.createElement('div');
        alert.className = `task-rich-alert task-rich-alert-${block.level}`;

        const title = document.createElement('div');
        title.className = 'task-rich-alert-title';
        title.textContent = `[!${block.title}]`;
        alert.appendChild(title);

        const body = document.createElement('div');
        body.className = 'task-rich-paragraph';
        appendInlineMarkdown(body, block.text || '');
        alert.appendChild(body);
        return alert;
      }

      if (block.type === 'subheading') {
        return createMarkdownTextRow('task-rich-subheading', block.text || '');
      }

      if (block.type === 'code') {
        const pre = document.createElement('pre');
        pre.className = 'task-rich-code';
        pre.textContent = block.text || '';
        return pre;
      }

      if (block.type === 'list') {
        return renderMarkdownListBlock(block);
      }

      return createMarkdownTextRow('task-rich-paragraph', block.text || '');
    }

    /**
     * Render a block stack into a target container.
     *
     * @param {HTMLElement} container
     * @param {Array<object>} blocks
     * @returns {void}
     */
    function appendMarkdownBlocks(container, blocks) {
      if (!Array.isArray(blocks) || blocks.length === 0) return;
      const stack = document.createElement('div');
      stack.className = 'task-rich-stack';
      blocks.forEach((block) => stack.appendChild(renderMarkdownBlock(block)));
      container.appendChild(stack);
    }

    /**
     * Create one task section with a header and body container.
     *
     * @param {string} title
     * @param {Node | null} [actionNode]
     * @returns {{ section: HTMLDivElement, body: HTMLDivElement }}
     */
    function createTaskSection(title, actionNode = null) {
      const section = document.createElement('div');
      section.className = 'task-section';

      const header = document.createElement('div');
      header.className = 'task-section-header';

      const titleNode = document.createElement('div');
      titleNode.className = 'task-section-title';
      titleNode.textContent = title;
      header.appendChild(titleNode);

      if (actionNode) {
        const actionWrap = document.createElement('div');
        actionWrap.className = 'task-section-action';
        actionWrap.appendChild(actionNode);
        header.appendChild(actionWrap);
      }

      const body = document.createElement('div');
      section.append(header, body);

      return { section, body };
    }

    /**
     * Render the task card for a workspace.
     *
     * @param {{progressExpanded: boolean}} nodeEntry
     * @param {object} taskView
     * @returns {HTMLDivElement}
     */
    function renderTaskCard(nodeEntry, taskView) {
      const card = document.createElement('div');
      card.className = `task-card ${taskView.mode === 'walkthrough' ? 'walkthrough' : 'progress'}`;

      const hero = document.createElement('div');
      hero.className = 'task-card-hero';

      const header = document.createElement('div');
      header.className = 'task-card-header';
      const badge = document.createElement('div');
      badge.className = 'task-badge';
      badge.textContent = taskView.mode === 'walkthrough' ? 'Walkthrough' : 'Progress';
      header.appendChild(badge);
      hero.appendChild(header);

      const title = document.createElement('div');
      title.className = 'task-card-title';
      title.textContent = taskView.goal || 'Task';
      hero.appendChild(title);

      const subtitle = document.createElement('div');
      subtitle.className = 'task-card-subtitle';
      subtitle.textContent = taskView.statusLine || (taskView.mode === 'walkthrough' ? 'Final summary ready.' : 'Progress is being tracked.');
      hero.appendChild(subtitle);
      if (taskView.mode !== 'walkthrough' && taskView.processLane) {
        const heroMeta = document.createElement('div');
        heroMeta.className = 'task-hero-meta';
        heroMeta.textContent = taskView.processLane;
        hero.appendChild(heroMeta);
      }
      card.appendChild(hero);

      if (taskView.mode === 'walkthrough' && taskView.walkthrough) {
        if (taskView.processLane) {
          const summaryLaneSection = createTaskSection('Process Lane');
          summaryLaneSection.body.appendChild(createMarkdownTextRow('task-process-lane', taskView.processLane));
          card.appendChild(summaryLaneSection.section);
        }

        if (Array.isArray(taskView.walkthrough.summaryChecklist) && taskView.walkthrough.summaryChecklist.length > 0) {
          const checklistSection = createTaskSection('Checklist Summary');
          checklistSection.body.appendChild(renderMarkdownListBlock({
            type: 'list',
            style: 'checklist',
            items: taskView.walkthrough.summaryChecklist,
          }));
          card.appendChild(checklistSection.section);
        }

        if (Array.isArray(taskView.walkthrough.preSectionBlocks) && taskView.walkthrough.preSectionBlocks.length > 0) {
          const prefaceSection = document.createElement('div');
          prefaceSection.className = 'task-section';
          appendMarkdownBlocks(prefaceSection, taskView.walkthrough.preSectionBlocks);
          card.appendChild(prefaceSection);
        }

        if (Array.isArray(taskView.walkthrough.sections)) {
          taskView.walkthrough.sections.forEach((section) => {
            const renderedSection = createTaskSection(section.title);
            appendMarkdownBlocks(renderedSection.body, section.blocks || []);
            card.appendChild(renderedSection.section);
          });
        }

        const hasStructuredWalkthrough = (
          (taskView.walkthrough.summaryChecklist || []).length > 0
          || (taskView.walkthrough.preSectionBlocks || []).length > 0
          || (taskView.walkthrough.sections || []).length > 0
        );
        if (!hasStructuredWalkthrough) {
          const fallbackSection = createTaskSection('Walkthrough');
          if (taskView.walkthrough.verification) {
            fallbackSection.body.appendChild(createMarkdownTextRow('task-meta-line', `Verification: ${taskView.walkthrough.verification}`));
          }
          if (taskView.walkthrough.summaryNotes) {
            fallbackSection.body.appendChild(createMarkdownTextRow('task-meta-line', `Summary: ${taskView.walkthrough.summaryNotes}`));
          }
          if (taskView.walkthrough.evidence) {
            fallbackSection.body.appendChild(createMarkdownTextRow('task-meta-line', `Evidence: ${taskView.walkthrough.evidence}`));
          }
          card.appendChild(fallbackSection.section);
        }

        return card;
      }

      let expandButton = null;
      if (taskView.progress.expandable || taskView.progress.overflowCount > 0) {
        expandButton = document.createElement('button');
        expandButton.className = 'task-expand-btn';
        expandButton.type = 'button';
        expandButton.textContent = nodeEntry.progressExpanded ? 'Collapse all' : 'Expand all ‹';
        expandButton.addEventListener('click', (event) => {
          event.stopPropagation();
          nodeEntry.progressExpanded = !nodeEntry.progressExpanded;
          nodeEntry.threadRenderKey = '';
          scheduleRender();
        });
      }

      const progressSection = createTaskSection('Progress Updates', expandButton);

      const previewCount = Number.isInteger(taskView.progress.previewCount) && taskView.progress.previewCount > 0
        ? taskView.progress.previewCount
        : 3;
      const visibleItems = nodeEntry.progressExpanded
        ? taskView.progress.items
        : taskView.progress.items.slice(Math.max(0, taskView.progress.items.length - previewCount));
      const hiddenCount = Math.max(0, taskView.progress.items.length - visibleItems.length);
      const items = visibleItems;
      if (items.length > 0) {
        const list = document.createElement('div');
        list.className = 'task-progress-list';
        items.forEach((item, index) => {
          list.appendChild(renderProgressItem(item, index));
        });
        progressSection.body.appendChild(list);
      }

      if (taskView.progress.expandable || taskView.progress.overflowCount > 0) {
        const actions = document.createElement('div');
        actions.className = 'task-card-actions';

        if (!nodeEntry.progressExpanded && hiddenCount > 0) {
          const hint = document.createElement('div');
          hint.className = 'task-overflow-hint';
          hint.textContent = `+${hiddenCount} more`;
          actions.appendChild(hint);
        }

        if (nodeEntry.progressExpanded && taskView.progress.items.length > previewCount) {
          const hint = document.createElement('div');
          hint.className = 'task-overflow-hint';
          hint.textContent = `${taskView.progress.items.length} total`;
          actions.appendChild(hint);
        }

        progressSection.body.appendChild(actions);
      }

      card.appendChild(progressSection.section);

      return card;
    }

    /**
     * Render one file or folder row for the workspace explorer.
     *
     * @param {{ workspaceKey: string, cwd: string, depth: number, item: object }} options
     * @returns {HTMLDivElement}
     */
    function renderExplorerItem(options) {
      const workspaceKey = options.workspaceKey;
      const cwd = options.cwd;
      const item = options.item;
      const depth = options.depth;
      const state = getExplorerState(workspaceKey);
      const relativePath = normalizeExplorerPath(item?.relativePath);
      const isDirectory = item?.kind === 'directory';
      const isExpanded = isDirectory && state.expandedPaths.has(relativePath);
      const row = document.createElement('div');
      row.className = `explorer-item${state.selectedPath === relativePath ? ' is-selected' : ''}`;
      row.style.paddingLeft = `${8 + depth * 18}px`;

      const chevron = document.createElement('div');
      chevron.className = isDirectory ? `explorer-item-chevron${isExpanded ? ' is-expanded' : ''}` : 'explorer-item-spacer';
      if (isDirectory) chevron.innerHTML = CHEVRON_RIGHT_ICON;

      const icon = document.createElement('div');
      icon.className = 'explorer-item-icon';
      icon.innerHTML = isDirectory ? TREE_FOLDER_ICON : FILE_ICON;

      const label = document.createElement('div');
      label.className = 'explorer-item-label';
      label.textContent = item?.name || relativePath || 'untitled';

      const kind = document.createElement('div');
      kind.className = 'explorer-item-kind';
      kind.textContent = isDirectory ? 'dir' : 'file';

      row.append(chevron, icon, label, kind);

      const openMenu = async (event) => {
        event.preventDefault();
        event.stopPropagation();
        state.selectedPath = relativePath;
        invalidateWorkspaceRenderKey(workspaceKey);
        scheduleRender();
        const anchorRect = row.getBoundingClientRect();
        await openExplorerContextMenu({
          anchorRect,
          workspaceKey,
          cwd,
          item,
        });
      };

      row.addEventListener('click', (event) => {
        event.stopPropagation();
        closeExplorerContextMenu();
        state.selectedPath = relativePath;
        invalidateWorkspaceRenderKey(workspaceKey);
        scheduleRender();
      });

      row.addEventListener('contextmenu', openMenu);
      row.addEventListener('dblclick', async (event) => {
        if (isDirectory) {
          await toggleExplorerDirectory({ workspaceKey, cwd, relativePath });
          return;
        }
        await openMenu(event);
      });

      if (isDirectory) {
        chevron.addEventListener('click', async (event) => {
          event.stopPropagation();
          await toggleExplorerDirectory({ workspaceKey, cwd, relativePath });
        });
      }

      return row;
    }

    /**
     * Render one directory subtree recursively.
     *
     * @param {{ container: HTMLElement, workspaceKey: string, cwd: string, relativePath?: string, depth?: number }} options
     * @returns {void}
     */
    function appendExplorerRows(options) {
      const workspaceKey = options.workspaceKey;
      const cwd = options.cwd;
      const relativePath = normalizeExplorerPath(options.relativePath);
      const depth = Number.isInteger(options.depth) ? options.depth : 0;
      const state = getExplorerState(workspaceKey);
      const entries = state.entriesByPath.get(relativePath);

      if (!entries) {
        if (!state.loadingPaths.has(relativePath)) {
          loadWorkspaceEntries({ workspaceKey, cwd, relativePath, force: false }).catch(showExplorerError);
        }
        if (depth === 0) {
          const loading = document.createElement('div');
          loading.className = 'explorer-loading';
          loading.textContent = 'Loading…';
          options.container.appendChild(loading);
        }
        return;
      }

      if (depth === 0 && entries.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'explorer-empty';
        empty.textContent = 'Empty workspace';
        options.container.appendChild(empty);
        return;
      }

      entries.forEach((item) => {
        options.container.appendChild(renderExplorerItem({ workspaceKey, cwd, depth, item }));
        if (item?.kind === 'directory' && state.expandedPaths.has(item.relativePath)) {
          appendExplorerRows({
            container: options.container,
            workspaceKey,
            cwd,
            relativePath: item.relativePath,
            depth: depth + 1,
          });
        }
      });
    }

    /**
     * Render the explorer panel for one expanded workspace.
     *
     * @param {{ workspaceKey: string, cwd: string }} options
     * @returns {HTMLDivElement}
     */
    function renderWorkspaceExplorer(options) {
      const workspaceKey = options.workspaceKey;
      const cwd = options.cwd;
      const panel = document.createElement('div');
      panel.className = 'explorer-panel';
      panel.addEventListener('click', (event) => event.stopPropagation());

      const header = document.createElement('div');
      header.className = 'explorer-header';

      const title = document.createElement('div');
      title.className = 'explorer-title';
      title.innerHTML = `${TREE_FOLDER_ICON}<span class="explorer-title-text">${cwd.split(/[\\/]/).pop() || cwd}</span>`;
      header.appendChild(title);

      const toolbar = document.createElement('div');
      toolbar.className = 'explorer-toolbar';
      const createFileButton = document.createElement('button');
      createFileButton.type = 'button';
      createFileButton.className = 'explorer-toolbar-btn';
      createFileButton.title = '新建文件';
      createFileButton.innerHTML = NEW_FILE_ICON;
      createFileButton.addEventListener('click', async (event) => {
        event.stopPropagation();
        closeExplorerContextMenu();
        await handleExplorerCreate({ workspaceKey, cwd, kind: 'file' });
      });

      const createFolderButton = document.createElement('button');
      createFolderButton.type = 'button';
      createFolderButton.className = 'explorer-toolbar-btn';
      createFolderButton.title = '新建文件夹';
      createFolderButton.innerHTML = NEW_FOLDER_ICON;
      createFolderButton.addEventListener('click', async (event) => {
        event.stopPropagation();
        closeExplorerContextMenu();
        await handleExplorerCreate({ workspaceKey, cwd, kind: 'directory' });
      });

      const refreshButton = document.createElement('button');
      refreshButton.type = 'button';
      refreshButton.className = 'explorer-toolbar-btn';
      refreshButton.title = '刷新';
      refreshButton.innerHTML = REFRESH_ICON;
      refreshButton.addEventListener('click', async (event) => {
        event.stopPropagation();
        closeExplorerContextMenu();
        await refreshWorkspaceExplorer({ workspaceKey, cwd });
      });

      toolbar.append(createFileButton, createFolderButton, refreshButton);
      header.appendChild(toolbar);
      panel.appendChild(header);

      const tree = document.createElement('div');
      tree.className = 'explorer-tree';
      appendExplorerRows({ container: tree, workspaceKey, cwd, relativePath: '', depth: 0 });
      panel.appendChild(tree);

      return panel;
    }

    /**
     * Create one workbench action button with a consistent visual style.
     *
     * @param {string} label
     * @param {() => void | Promise<void>} onClick
     * @param {{ disabled?: boolean, title?: string, variant?: string, active?: boolean }} [options]
     * @returns {HTMLButtonElement}
     */
    function createWorkspaceDocumentButton(label, onClick, options = {}) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = ['workspace-document-button', options.variant].filter(Boolean).join(' ');
      if (options.active) {
        button.classList.add('active');
      }
      button.disabled = !!options.disabled;
      button.textContent = label;
      if (options.title) button.title = options.title;
      button.addEventListener('click', async (event) => {
        event.stopPropagation();
        if (button.disabled) return;
        await onClick();
      });
      return button;
    }

    /**
     * Render the active workspace document panel.
     *
     * @param {object} nodeEntry
     * @param {string} workspaceKey
     * @param {string} cwd
     * @returns {void}
     */
    function renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd) {
      if (!nodeEntry?.documentPanel) return;
      const state = ensureWorkspaceDocumentState(workspaceKey, cwd);
      state.workspaceKey = workspaceKey;
      state.cwd = cwd;
      nodeEntry.documentUi = null;

      const surface = document.createElement('div');
      surface.className = 'workspace-document-panel';

      if (!cwd) {
        const empty = document.createElement('div');
        empty.className = 'workspace-document-empty';
        empty.textContent = 'No workspace folder is available for the embedded workbench.';
        surface.appendChild(empty);
        nodeEntry.documentPanel.replaceChildren(surface);
        return;
      }

      if (!state.document && !state.loading && !state.error) {
        const empty = document.createElement('div');
        empty.className = 'workspace-document-empty';
        empty.textContent = DOCUMENT_EMPTY_HINT;
        surface.appendChild(empty);
        nodeEntry.documentPanel.replaceChildren(surface);
        return;
      }

      const header = document.createElement('div');
      header.className = 'workspace-document-header';

      const titleWrap = document.createElement('div');
      titleWrap.className = 'workspace-document-title-wrap';

      const title = document.createElement('div');
      title.className = 'workspace-document-title';

      const titleName = document.createElement('span');
      titleName.className = 'workspace-document-title-name';
      titleName.textContent = state.document?.fileName || state.activeRelativePath || 'Workbench';

      const badge = document.createElement('span');
      badge.className = 'workspace-document-badge';

      title.append(titleName, badge);

      const pathLabel = document.createElement('div');
      pathLabel.className = 'workspace-document-path';
      pathLabel.textContent = state.activeRelativePath || cwd;

      titleWrap.append(title, pathLabel);

      const actions = document.createElement('div');
      actions.className = 'workspace-document-actions';

      let compileBtn = null;
      let previewToggleBtn = null;
      let sourceToggleBtn = null;
      if (state.document?.mode === 'markdown') {
        previewToggleBtn = createWorkspaceDocumentButton(
          state.previewMode === 'preview' ? 'Edit' : 'Preview',
          () => {
            state.previewMode = state.previewMode === 'preview' ? 'edit' : 'preview';
            renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
          },
          { active: state.previewMode === 'preview' }
        );
        actions.appendChild(previewToggleBtn);
      }
      if (state.document?.mode === 'tex') {
        sourceToggleBtn = createWorkspaceDocumentButton('Source', () => {
          state.previewMode = 'edit';
          renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
        }, {
          active: state.previewMode !== 'preview',
          disabled: state.loading,
        });
        previewToggleBtn = createWorkspaceDocumentButton('Preview', () => {
          if (!state.texCompileResult) return;
          state.previewMode = 'preview';
          renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
        }, {
          active: state.previewMode === 'preview',
          disabled: !state.texCompileResult,
        });
        compileBtn = createWorkspaceDocumentButton('Compile', () => compileWorkspaceDocument(nodeEntry, state), {
          variant: 'primary',
          disabled: state.loading || state.saving || state.compiling,
          title: 'Compile this TeX file into PDF',
        });
        actions.append(sourceToggleBtn, previewToggleBtn, compileBtn);
      }

      const saveBtn = createWorkspaceDocumentButton('Save', () => saveWorkspaceDocument(nodeEntry, state), {
        variant: 'primary',
        disabled: !state.document?.isEditable || !state.dirty || state.loading || state.saving,
      });
      actions.appendChild(saveBtn);

      header.append(titleWrap, actions);
      surface.appendChild(header);

      const status = document.createElement('div');
      status.className = 'workspace-document-status';
      surface.appendChild(status);

      const body = document.createElement('div');
      body.className = 'workspace-document-surface';
      surface.appendChild(body);

      if (state.loading) {
        const loading = document.createElement('div');
        loading.className = 'workspace-document-loading';
        loading.textContent = state.statusMessage || 'Opening document...';
        body.appendChild(loading);
      } else if (state.error && !state.document) {
        const error = document.createElement('div');
        error.className = 'workspace-document-empty';
        error.textContent = state.error;
        body.appendChild(error);
      } else if (state.document?.mode === 'pdf') {
        const toolbar = document.createElement('div');
        toolbar.className = 'workspace-pdf-toolbar';

        const controls = document.createElement('div');
        controls.className = 'workspace-pdf-controls';
        const prevBtn = createWorkspaceDocumentButton('‹', () => {
          state.pdfView.page = Math.max(1, state.pdfView.page - 1);
          renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
        }, {
          disabled: state.pdfView.page <= 1,
        });
        const pageInput = document.createElement('input');
        pageInput.className = 'workspace-pdf-page-input';
        pageInput.type = 'number';
        pageInput.min = '1';
        pageInput.value = String(state.pdfView.page || 1);
        pageInput.addEventListener('change', () => {
          const nextPage = Math.max(1, Number.parseInt(pageInput.value || '1', 10) || 1);
          state.pdfView.page = state.pdfView.pageCount ? Math.min(nextPage, state.pdfView.pageCount) : nextPage;
          renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
        });
        const pageCount = document.createElement('span');
        pageCount.className = 'workspace-pdf-count';
        pageCount.textContent = `/ ${state.document.pdf?.pageCount || '?'}`;
        const nextBtn = createWorkspaceDocumentButton('›', () => {
          const maxPage = state.document.pdf?.pageCount || state.pdfView.page + 1;
          state.pdfView.page = Math.min(maxPage, state.pdfView.page + 1);
          renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
        }, {
          disabled: !!state.document.pdf?.pageCount && state.pdfView.page >= state.document.pdf.pageCount,
        });
        controls.append(prevBtn, pageInput, pageCount, nextBtn);

        const zoomControls = document.createElement('div');
        zoomControls.className = 'workspace-pdf-controls';
        const zoomOut = createWorkspaceDocumentButton('−', () => {
          const currentIndex = PDF_PRESET_ZOOMS.findIndex((value) => value >= state.pdfView.zoom);
          const nextIndex = currentIndex <= 0 ? 0 : currentIndex - 1;
          state.pdfView.zoom = PDF_PRESET_ZOOMS[nextIndex];
          renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
        });
        const zoomLabel = document.createElement('span');
        zoomLabel.className = 'workspace-pdf-zoom';
        zoomLabel.textContent = `${state.pdfView.zoom}%`;
        const zoomIn = createWorkspaceDocumentButton('+', () => {
          const currentIndex = PDF_PRESET_ZOOMS.findIndex((value) => value >= state.pdfView.zoom);
          const nextIndex = currentIndex === -1 ? PDF_PRESET_ZOOMS.length - 1 : Math.min(PDF_PRESET_ZOOMS.length - 1, currentIndex + 1);
          state.pdfView.zoom = PDF_PRESET_ZOOMS[nextIndex];
          renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
        });
        zoomControls.append(zoomOut, zoomLabel, zoomIn);

        toolbar.append(controls, zoomControls);
        body.appendChild(toolbar);

        const frame = document.createElement('iframe');
        frame.className = 'workspace-pdf-frame';
        frame.src = buildWorkspacePdfViewerUrl(state.document.pdf.fileUrl, state.pdfView);
        body.appendChild(frame);
      } else if (state.document?.mode === 'markdown' && state.previewMode === 'preview') {
        const toolbar = document.createElement('div');
        toolbar.className = 'workspace-editor-toolbar';
        const previewHint = document.createElement('div');
        previewHint.className = 'workspace-document-path';
        previewHint.textContent = 'Markdown preview';
        toolbar.appendChild(previewHint);
        body.appendChild(toolbar);

        const preview = document.createElement('div');
        preview.className = 'workspace-document-preview';
        preview.appendChild(buildMarkdownPreviewFragment(state.draftContent));
        body.appendChild(preview);
      } else if (state.document?.mode === 'tex' && state.previewMode === 'preview' && state.texCompileResult?.outputFileUrl) {
        const toolbar = document.createElement('div');
        toolbar.className = 'workspace-pdf-toolbar';

        const controls = document.createElement('div');
        controls.className = 'workspace-pdf-controls';
        const prevBtn = createWorkspaceDocumentButton('‹', () => {
          state.pdfView.page = Math.max(1, state.pdfView.page - 1);
          renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
        }, { disabled: state.pdfView.page <= 1 });
        const pageInput = document.createElement('input');
        pageInput.className = 'workspace-pdf-page-input';
        pageInput.type = 'number';
        pageInput.min = '1';
        pageInput.value = String(state.pdfView.page || 1);
        pageInput.addEventListener('change', () => {
          const nextPage = Math.max(1, Number.parseInt(pageInput.value || '1', 10) || 1);
          state.pdfView.page = state.pdfView.pageCount ? Math.min(nextPage, state.pdfView.pageCount) : nextPage;
          renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
        });
        const pageCount = document.createElement('span');
        pageCount.className = 'workspace-pdf-count';
        pageCount.textContent = `/ ${state.pdfView.pageCount || '?'}`;
        const nextBtn = createWorkspaceDocumentButton('›', () => {
          const maxPage = state.pdfView.pageCount || state.pdfView.page + 1;
          state.pdfView.page = Math.min(maxPage, state.pdfView.page + 1);
          renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
        }, {
          disabled: !!state.pdfView.pageCount && state.pdfView.page >= state.pdfView.pageCount,
        });
        controls.append(prevBtn, pageInput, pageCount, nextBtn);
        toolbar.appendChild(controls);
        body.appendChild(toolbar);

        const frame = document.createElement('iframe');
        frame.className = 'workspace-pdf-frame';
        frame.src = buildWorkspacePdfViewerUrl(state.texCompileResult.outputFileUrl, state.pdfView);
        body.appendChild(frame);
      } else {
        if (state.document?.mode === 'markdown') {
          const toolbar = document.createElement('div');
          toolbar.className = 'workspace-editor-toolbar';

          const formattingGroup = document.createElement('div');
          formattingGroup.className = 'workspace-editor-toolbar-group';
          MARKDOWN_TOOLBAR_ITEMS.forEach((item) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'workspace-toolbar-btn';
            button.title = item.title;
            button.textContent = item.label;
            button.addEventListener('click', (event) => {
              event.stopPropagation();
              const textarea = nodeEntry.documentUi?.textarea;
              if (!textarea) return;
              item.action(textarea);
            });
            formattingGroup.appendChild(button);
          });

          const toggleGroup = document.createElement('div');
          toggleGroup.className = 'workspace-editor-toolbar-group';
          const previewButton = document.createElement('button');
          previewButton.type = 'button';
          previewButton.className = 'workspace-toolbar-btn';
          previewButton.title = 'Preview Markdown';
          previewButton.textContent = '👁';
          previewButton.addEventListener('click', (event) => {
            event.stopPropagation();
            state.previewMode = 'preview';
            renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd);
          });
          toggleGroup.appendChild(previewButton);

          toolbar.append(formattingGroup, toggleGroup);
          body.appendChild(toolbar);
        }

        const shell = document.createElement('div');
        shell.className = 'workspace-editor-shell';
        const gutter = document.createElement('div');
        gutter.className = 'workspace-editor-gutter';
        gutter.hidden = !shouldShowDocumentLineNumbers(state.document);
        const textarea = document.createElement('textarea');
        textarea.className = 'workspace-editor-textarea';
        if (state.document?.mode === 'markdown') {
          textarea.classList.add('markdown-mode');
        }
        textarea.spellcheck = state.document?.mode === 'markdown';
        textarea.value = state.draftContent;
        textarea.addEventListener('input', () => handleWorkspaceEditorInput(nodeEntry, state, textarea, gutter));
        textarea.addEventListener('scroll', () => {
          gutter.scrollTop = textarea.scrollTop;
        });
        textarea.addEventListener('keydown', (event) => {
          const isMeta = event.metaKey || event.ctrlKey;
          if (isMeta && event.key.toLowerCase() === 's') {
            event.preventDefault();
            void saveWorkspaceDocument(nodeEntry, state);
          }
        });
        syncWorkspaceEditorGutter(gutter, state.draftContent);
        shell.append(gutter, textarea);
        body.appendChild(shell);

        nodeEntry.documentUi = {
          badgeEl: badge,
          statusEl: status,
          saveBtn,
          compileBtn,
          textarea,
          gutterEl: gutter,
        };
      }

      if (!nodeEntry.documentUi) {
        nodeEntry.documentUi = {
          badgeEl: badge,
          statusEl: status,
          saveBtn,
          compileBtn,
        };
      }

      if (state.document?.mode === 'tex' && state.texCompileResult?.logs) {
        const compileLog = document.createElement('pre');
        compileLog.className = 'workspace-compile-log';
        compileLog.textContent = state.texCompileResult.logs.split('\n').slice(-20).join('\n');
        surface.appendChild(compileLog);
      }

      nodeEntry.documentPanel.replaceChildren(surface);
      refreshWorkspaceDocumentUiState(nodeEntry, state);
    }

    /**
     * Find one cached explorer entry by its relative path.
     *
     * @param {{ entriesByPath: Map<string, Array<object>> }} state
     * @param {string} relativePath
     * @returns {object | null}
     */
    function findExplorerItem(state, relativePath) {
      for (const entries of state.entriesByPath.values()) {
        const match = (entries || []).find((entry) => normalizeExplorerPath(entry?.relativePath) === relativePath);
        if (match) return match;
      }
      return null;
    }

    /**
     * Return the currently selected explorer item for keyboard shortcuts.
     *
     * @returns {{ workspaceKey: string, cwd: string, item: object } | null}
     */
    function getSelectedExplorerContext() {
      if (!expandedWorkspaceCwd || !workspaceNodeMap.has(expandedWorkspaceCwd)) {
        return null;
      }

      const workspaceEntry = latestPayload.entries.find((entry) => entry.workspaceKey === expandedWorkspaceCwd && entry.cwd);
      const cwd = workspaceEntry?.cwd || null;
      if (!cwd) return null;

      const state = getExplorerState(expandedWorkspaceCwd);
      const relativePath = normalizeExplorerPath(state.selectedPath);
      if (!relativePath) return null;

      const item = findExplorerItem(state, relativePath);
      if (!item) return null;

      return {
        workspaceKey: expandedWorkspaceCwd,
        cwd,
        item,
      };
    }

    /**
     * Build a stable key for the thread list inside one workspace.
     *
     * @param {Array<object>} threads
     * @returns {string}
     */
    function buildThreadRenderKey(threads) {
      return threads.map((thread) => [
        thread.id,
        thread.state,
        thread.updatedAt,
        thread.lastEvent || '',
        thread.isFocused ? 1 : 0,
        thread.agentId || ''
      ].join('~')).join('||');
    }

    /**
     * Format one thread timestamp into a compact relative label.
     *
     * @param {number | string | Date | null | undefined} updatedAt
     * @returns {string}
     */
    function formatThreadRelativeTime(updatedAt) {
      const value = updatedAt instanceof Date ? updatedAt.getTime() : Number(updatedAt);
      if (!Number.isFinite(value) || value <= 0) return '';

      const deltaMs = Date.now() - value;
      if (deltaMs < 60_000) return 'now';

      const minutes = Math.floor(deltaMs / 60_000);
      if (minutes < 60) return `${minutes} min`;

      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} h`;

      const days = Math.floor(hours / 24);
      return `${days} d`;
    }

    /**
     * Render the thread list for a workspace with safe DOM APIs.
     *
     * @param {{threadPanel: HTMLDivElement, threadRenderKey: string, progressExpanded: boolean}} nodeEntry
     * @param {string} workspaceKey
     * @param {string | null} cwd
     * @param {Array<object>} threads
     * @param {object | null | undefined} taskView
     * @returns {void}
     */
    function renderWorkspaceThreads(nodeEntry, workspaceKey, cwd, threads, taskView) {
      const nextThreadKey = [
        buildThreadRenderKey(threads),
        buildTaskRenderKey(taskView, nodeEntry.progressExpanded),
        workspaceKey,
        cwd || ''
      ].join('::');
      if (nodeEntry.threadRenderKey === nextThreadKey) return;

      nodeEntry.threadRenderKey = nextThreadKey;
      const targetPanel = nodeEntry.activityPanel || nodeEntry.threadPanel;
      const fragment = document.createDocumentFragment();

      if (taskView) {
        fragment.appendChild(renderTaskCard(nodeEntry, taskView));
      }

      if (threads.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding: 12px 14px; font-size: 11px; color: var(--text-dim); font-style: italic;';
        empty.textContent = taskView ? 'No active threads in this workspace.' : 'No active threads in this workspace.';
        fragment.appendChild(empty);
        targetPanel.replaceChildren(fragment);
        return;
      }

      threads.forEach((thread) => {
        const threadItem = document.createElement('div');
        threadItem.className = 'thread-item' + (thread.isFocused ? ' active' : '');

        const statusDot = document.createElement('div');
        statusDot.className = 'status-dot';
        if (thread.state === 'working' || thread.state === 'thinking') {
          statusDot.classList.add(thread.state);
        }

        const agentIcon = createIconNode(AGENT_ICONS[thread.agentId] || AGENT_ICONS.default, 'agent-icon');

        const threadInfo = document.createElement('div');
        threadInfo.className = 'thread-info';
        const threadId = document.createElement('div');
        threadId.className = 'thread-id';
        threadId.textContent = thread.id.substring(0, 8);
        const threadStatus = document.createElement('div');
        threadStatus.className = 'thread-status';
        threadStatus.textContent = thread.lastEvent || (thread.state.charAt(0).toUpperCase() + thread.state.slice(1));
        threadInfo.append(threadId, threadStatus);

        const timeEl = document.createElement('div');
        timeEl.style.cssText = 'font-size:10px; opacity:0.4';
        timeEl.textContent = formatThreadRelativeTime(thread.updatedAt);

        threadItem.append(statusDot, agentIcon, threadInfo, timeEl);
        threadItem.addEventListener('click', () => {
          closeWorkspaceTreeContextMenu();
          window.sessionsAPI.focusThread(thread.id);
        });
        fragment.appendChild(threadItem);
      });

      targetPanel.replaceChildren(fragment);
    }

    /**
     * Coalesce renderer updates to one paint per animation frame.
     *
     * @returns {void}
     */
    function scheduleRender() {
      if (renderQueued) return;
      renderQueued = true;

      requestAnimationFrame(() => {
        renderQueued = false;
        const renderKey = buildPayloadKey(latestPayload);
        renderSessions(latestPayload, renderKey);
      });
    }

    window.sessionsAPI.onSessionsUpdate((payload) => {
      latestPayload = normalizePayload(payload);
      scheduleRender();
    });

    /**
     * Render grouped sessions and preserve the expanded workspace across updates.
     *
     * @param {{ entries: Array<object>, focusedSessionId: string | null, workspaceTaskViews: Record<string, object> }} payload
     * @param {string} renderKey
     * @returns {void}
     */
    function renderSessions(payload, renderKey = buildPayloadKey(payload)) {
      const sessions = payload.entries || [];
      const workspaceTaskViews = payload.workspaceTaskViews || {};

      if (sessions.length === 0) {
        expandedWorkspaceCwd = null;
        shouldAutoExpandWorkspace = true;
        workspaceNodeMap = new Map();
        lastRenderKey = renderKey;
        renderEmptyState();
        return;
      }

      // Group by CWD
      const groups = {};
      sessions.forEach(s => {
        const workspaceKey = (typeof s.workspaceKey === 'string' && s.workspaceKey) || s.cwd || UNASSIGNED_WORKSPACE_KEY;
        const cwd = typeof s.cwd === 'string' && s.cwd ? s.cwd : null;
        if (!groups[workspaceKey]) {
          groups[workspaceKey] = {
            workspaceKey,
            cwd,
            threads: [],
            maxUpdated: 0,
            isActive: false,
            isStatic: false,
            hasFocusedThread: false,
            isUnassigned: !cwd
          };
        }
        if (!s.isStatic) {
          groups[workspaceKey].threads.push(s);
          groups[workspaceKey].isStatic = false;
        } else {
          groups[workspaceKey].isStatic = true;
        }
        
        if (s.isActive) groups[workspaceKey].isActive = true;
        if (s.isFocused) groups[workspaceKey].hasFocusedThread = true;
        if (s.updatedAt > groups[workspaceKey].maxUpdated) {
          groups[workspaceKey].maxUpdated = s.updatedAt;
        }
      });

      // Sort by active first, then by recency (maxUpdated)
      const sortedGroups = Object.entries(groups).sort((a, b) => {
        if (a[1].isActive !== b[1].isActive) return b[1].isActive ? 1 : -1;
        return b[1].maxUpdated - a[1].maxUpdated;
      });

      if (expandedWorkspaceCwd && !groups[expandedWorkspaceCwd]) {
        expandedWorkspaceCwd = null;
        shouldAutoExpandWorkspace = true;
        activeWorkspaceTreeKey = null;
      }

      if (!expandedWorkspaceCwd && shouldAutoExpandWorkspace && sortedGroups.length > 0) {
        const preferredGroup = sortedGroups.find(([, data]) => data.hasFocusedThread || data.isActive) || sortedGroups[0];
        expandedWorkspaceCwd = preferredGroup[0];
        shouldAutoExpandWorkspace = false;
        activeWorkspaceTreeKey = expandedWorkspaceCwd;
      }

      const nextWorkspaceNodeMap = new Map();
      const orderedNodes = [];

      sortedGroups.forEach(([workspaceKey, data]) => {
        const cwd = data.cwd;
        const workspaceName = cwd ? (cwd.split(/[\\/]/).pop() || cwd) : 'Unassigned Sessions';
        const threads = data.threads;
        const isActive = data.isActive;
        const hasWorkspaceRoot = !!cwd;

        const nodeEntry = workspaceNodeMap.get(workspaceKey) || createWorkspaceNodes();
        nodeEntry.workspaceKey = workspaceKey;
        nodeEntry.cwd = cwd || '';
        nodeEntry.row.className = 'workspace-row' + (isActive ? ' active-ws' : '');
        nodeEntry.row.title = cwd || 'Workspace path unavailable';
        nodeEntry.workspaceNameEl.title = cwd || 'Workspace path unavailable';
        nodeEntry.nameText.textContent = workspaceName;
        nodeEntry.activeBadgeEl.hidden = !isActive;
        nodeEntry.actions.hidden = !hasWorkspaceRoot;
        nodeEntry.deleteBtn.onclick = (event) => {
          event.stopPropagation();
          if (!cwd) return;
          window.sessionsAPI.closeWorkspace(cwd);
        };
        nodeEntry.createProcessBtn.onclick = (event) => {
          event.stopPropagation();
          if (!cwd) return;
          window.sessionsAPI.newThread(cwd);
        };
        nodeEntry.treeNewFileBtn.onclick = async (event) => {
          event.stopPropagation();
          if (!cwd) return;
          await runWorkspaceTreeCreateOperation(nodeEntry, ensureWorkspaceTreeState(workspaceKey, cwd), 'file');
        };
        nodeEntry.treeNewFolderBtn.onclick = async (event) => {
          event.stopPropagation();
          if (!cwd) return;
          await runWorkspaceTreeCreateOperation(nodeEntry, ensureWorkspaceTreeState(workspaceKey, cwd), 'directory');
        };
        nodeEntry.treeRefreshBtn.onclick = async (event) => {
          event.stopPropagation();
          if (!cwd) return;
          await refreshWorkspaceTreePanel(nodeEntry, ensureWorkspaceTreeState(workspaceKey, cwd), { keepSelection: true });
        };

        renderWorkspaceThreads(nodeEntry, workspaceKey, cwd, threads, cwd ? workspaceTaskViews[cwd] : null);
        renderWorkspaceDocumentPanel(nodeEntry, workspaceKey, cwd || '');
        renderWorkspaceTreePanel(nodeEntry, workspaceKey, cwd || '', { deferLoad: workspaceKey !== expandedWorkspaceCwd });

        nodeEntry.row.onclick = () => {
          closeWorkspaceTreeContextMenu();
          toggleWorkspaceExpansion(workspaceKey);
        };
        nodeEntry.row.onkeydown = (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          closeWorkspaceTreeContextMenu();
          toggleWorkspaceExpansion(workspaceKey);
        };

        nextWorkspaceNodeMap.set(workspaceKey, nodeEntry);
        orderedNodes.push(nodeEntry.row, nodeEntry.threadsContainer);
      });

      listEl.replaceChildren(...orderedNodes);
      workspaceNodeMap = nextWorkspaceNodeMap;
      lastRenderKey = renderKey;
      applyExpandedWorkspaceState();
    }

    document.addEventListener('click', () => {
      closeWorkspaceTreeContextMenu();
    });

    document.getElementById('close-sessions').onclick = () => window.sessionsAPI.hideSessions();
  </script>
</body>
</html>
