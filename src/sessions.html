<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg: rgba(20, 20, 20, 0.95);
      --text: #e0e0e0;
      --text-dim: #a0a0a0;
      --accent: #58a6ff;
      --danger: #f85149;
      --hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.1);
      --bg-gradient: linear-gradient(145deg, rgba(30,30,30,0.98), rgba(15,15,15,0.95));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #container {
      width: 100%;
      height: 100vh;
      background: var(--bg-gradient);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px);
      animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes slideIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    #header {
      padding: 14px 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.02);
      text-transform: uppercase;
      font-size: 11px;
      color: var(--text-dim);
    }

    #workspace-list {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 8px 0;
    }

    #workspace-list::-webkit-scrollbar {
      width: 4px;
    }
    #workspace-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }

    .workspace-row {
      min-height: 44px;
      margin: 0 10px 6px;
      padding: 0 12px 0 10px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s ease, color 0.2s ease;
      position: relative;
    }

    .workspace-row:hover,
    .workspace-row.expanded {
      background: var(--hover);
    }

    .workspace-row.active-ws {
      background: rgba(88, 166, 255, 0.08);
    }

    .workspace-row.active-ws:hover,
    .workspace-row.active-ws.expanded {
      background: rgba(88, 166, 255, 0.14);
    }

    .folder-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.2s ease;
      color: var(--text-dim);
    }

    .folder-icon svg {
      display: block;
    }

    .folder-path, .arrow-path {
      transition: opacity 0.2s ease;
    }

    .arrow-path {
      display: none;
      opacity: 0;
    }

    .workspace-row:hover .folder-icon,
    .workspace-row.expanded .folder-icon {
      color: var(--text);
    }

    .workspace-row:hover .folder-icon .folder-path,
    .workspace-row.expanded .folder-icon .folder-path {
      display: none;
    }

    .workspace-row:hover .folder-icon .arrow-path,
    .workspace-row.expanded .folder-icon .arrow-path {
      display: block;
      opacity: 1;
    }

    .workspace-name {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      font-size: 14px;
      line-height: 1.2;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .workspace-row:hover .actions,
    .workspace-row.expanded .actions {
      opacity: 1;
      pointer-events: auto;
    }

    .action-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      padding: 0;
      color: var(--text-dim);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      appearance: none;
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .action-btn:focus-visible,
    .workspace-row:focus-visible {
      outline: 2px solid rgba(88, 166, 255, 0.7);
      outline-offset: 2px;
    }

    .action-btn.delete:hover {
      background: rgba(248, 81, 73, 0.16);
      color: #ff9b95;
    }

    .action-btn.process:hover {
      background: rgba(88, 166, 255, 0.16);
      color: #9bc9ff;
    }

    .threads-container {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(0,0,0,0.15);
    }

    .threads-container.expanded {
      max-height: 2800px;
      border-bottom: 1px solid var(--border);
    }

    .workspace-expanded-shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      gap: 12px;
      padding: 12px 12px 14px 42px;
      align-items: start;
    }

    .workspace-tree-panel {
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      background: rgba(0,0,0,0.18);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .workspace-tree-toolbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
    }

    .workspace-tree-toolbar-button {
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: rgba(224,224,224,0.92);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .workspace-tree-toolbar-button:hover {
      background: rgba(88, 166, 255, 0.16);
      border-color: rgba(88, 166, 255, 0.28);
      color: #fff;
    }

    .workspace-tree-toolbar-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .workspace-tree-viewport {
      max-height: 380px;
      overflow: auto;
      padding: 8px;
    }

    .workspace-tree-viewport::-webkit-scrollbar {
      width: 4px;
    }

    .workspace-tree-viewport::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.18);
      border-radius: 2px;
    }

    .workspace-tree-root {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .workspace-tree-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease;
      color: rgba(224,224,224,0.86);
    }

    .workspace-tree-item:hover {
      background: var(--hover);
      color: var(--text);
    }

    .workspace-tree-item.selected {
      background: rgba(88, 166, 255, 0.15);
      color: #fff;
    }

    .workspace-tree-item.is-directory .workspace-tree-item-name {
      font-weight: 700;
    }

    .workspace-tree-disclosure {
      width: 16px;
      min-width: 16px;
      height: 16px;
      border: 0;
      background: transparent;
      color: rgba(224,224,224,0.6);
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex: 0 0 auto;
    }

    .workspace-tree-disclosure:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .workspace-tree-disclosure.is-hidden {
      visibility: hidden;
    }

    .workspace-tree-item-icon {
      width: 14px;
      min-width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(88, 166, 255, 0.96);
      flex: 0 0 auto;
    }

    .workspace-tree-item-icon svg {
      width: 14px;
      height: 14px;
    }

    .workspace-tree-item-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      line-height: 1.35;
    }

    .workspace-tree-item-meta {
      flex: 0 0 auto;
      font-size: 10px;
      opacity: 0.54;
    }

    .workspace-tree-children {
      margin-left: 14px;
      padding-left: 8px;
      border-left: 1px dashed rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .workspace-tree-empty {
      padding: 12px 10px;
      color: var(--text-dim);
      font-style: italic;
      font-size: 11px;
      line-height: 1.5;
    }

    .workspace-tree-footer {
      padding: 8px 10px 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 10px;
      line-height: 1.4;
      color: rgba(224,224,224,0.55);
      min-height: 30px;
    }

    .workspace-tree-status {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .workspace-tree-status code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.9);
    }

    .workspace-thread-panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .workspace-thread-panel .task-card {
      margin: 0;
    }

    .workspace-thread-panel .task-card-hero {
      padding: 14px 14px 12px;
    }

    .workspace-thread-panel .task-section {
      padding: 12px 14px;
    }

    .workspace-thread-panel .thread-item {
      padding-left: 14px;
    }

    .workspace-context-menu {
      position: fixed;
      z-index: 2000;
      min-width: 220px;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(20, 20, 20, 0.98);
      box-shadow: 0 18px 42px rgba(0,0,0,0.38);
      backdrop-filter: blur(20px);
    }

    .workspace-context-menu[hidden] {
      display: none;
    }

    .workspace-context-menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: rgba(224,224,224,0.96);
      font-size: 11px;
      cursor: pointer;
      text-align: left;
    }

    .workspace-context-menu-item:hover {
      background: rgba(88, 166, 255, 0.14);
    }

    .workspace-context-menu-item:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .workspace-context-menu-label {
      flex: 1;
      min-width: 0;
    }

    .workspace-context-menu-shortcut {
      flex: 0 0 auto;
      color: rgba(224,224,224,0.5);
      font-size: 10px;
      white-space: nowrap;
    }

    .workspace-tree-rename-input {
      width: 100%;
      border: 1px solid rgba(88, 166, 255, 0.35);
      border-radius: 8px;
      background: rgba(10, 12, 14, 0.96);
      color: var(--text);
      font: inherit;
      padding: 4px 8px;
      outline: none;
    }

    @media (max-width: 940px) {
      .workspace-expanded-shell {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .task-card {
      margin: 10px 12px 10px 42px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.012)),
        rgba(20, 20, 20, 0.94);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
    }

    .task-card.walkthrough {
      border-color: rgba(88, 166, 255, 0.18);
    }

    .task-card.progress {
      border-color: rgba(255,255,255,0.1);
    }

    .task-card-hero {
      padding: 18px 18px 16px;
    }

    .task-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .task-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: rgba(224,224,224,0.5);
    }

    .task-card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .task-card-subtitle {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(224,224,224,0.92);
    }

    .task-hero-meta {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(224,224,224,0.58);
    }

    .task-section {
      padding: 13px 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .task-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .task-section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(224,224,224,0.5);
    }

    .task-section-action {
      font-size: 11px;
      color: rgba(224,224,224,0.5);
    }

    .task-process-lane,
    .task-meta-line,
    .task-rich-paragraph {
      font-size: 11px;
      line-height: 1.6;
      color: rgba(224,224,224,0.68);
    }

    .task-process-lane code,
    .task-meta-line code,
    .task-inline-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255,255,255,0.09);
    }

    .task-rich-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-rich-subheading {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.92);
      margin-bottom: 2px;
    }

    .task-rich-alert {
      border-left: 4px solid #f28c3a;
      border-radius: 14px;
      padding: 14px 16px;
      background: rgba(108, 57, 30, 0.55);
      color: rgba(255,255,255,0.88);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .task-rich-alert-note {
      border-left-color: #f28c3a;
    }

    .task-rich-alert-important {
      border-left-color: #f28c3a;
      background: rgba(122, 64, 32, 0.62);
    }

    .task-rich-alert-warning,
    .task-rich-alert-caution {
      border-left-color: #ffb347;
    }

    .task-rich-alert-tip {
      border-left-color: #4fb477;
    }

    .task-rich-alert-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.76);
      margin-bottom: 6px;
    }

    .task-rich-code {
      margin: 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,0.24);
      color: rgba(255,255,255,0.88);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 11px;
      line-height: 1.55;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .task-rich-list,
    .task-progress-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-rich-list-item,
    .task-progress-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 12px;
      line-height: 1.48;
      color: rgba(224,224,224,0.96);
    }

    .task-progress-item {
      padding: 0;
      font-weight: 600;
    }

    .task-rich-list-item-text,
    .task-progress-text {
      flex: 1;
      min-width: 0;
    }

    .task-progress-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 1px;
    }

    .task-rich-marker,
    .task-progress-marker {
      width: 20px;
      min-width: 20px;
      height: 20px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      margin-top: 1px;
    }

    .task-progress-marker,
    .task-rich-marker-check.is-checked {
      background: #f28c3a;
      color: #24150a;
      box-shadow: 0 4px 12px rgba(242, 140, 58, 0.22);
    }

    .task-progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      max-width: 100%;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(34, 34, 34, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03),
        0 10px 20px rgba(0,0,0,0.18);
      color: rgba(236,236,236,0.92);
      overflow: hidden;
    }

    .task-progress-pill-kind {
      color: rgba(255,255,255,0.58);
      font-weight: 700;
      letter-spacing: 0.01em;
      flex: 0 0 auto;
    }

    .task-progress-pill-target {
      min-width: 0;
      color: rgba(255,255,255,0.96);
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-progress-pill-ref {
      flex: 0 0 auto;
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .task-progress-pill-stats {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      padding-left: 2px;
      margin-left: 2px;
      border-left: 1px solid rgba(255,255,255,0.08);
    }

    .task-progress-pill-stat {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .task-progress-pill-stat.is-plus {
      color: #4de18a;
    }

    .task-progress-pill-stat.is-minus {
      color: #ff7f7f;
    }

    .task-rich-marker-check {
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.22);
      background: transparent;
    }

    .task-rich-marker-order {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.82);
      border-radius: 999px;
    }

    .task-rich-marker-bullet {
      width: 8px;
      min-width: 8px;
      height: 8px;
      border-radius: 999px;
      margin: 7px 7px 0;
      background: rgba(255,255,255,0.34);
    }

    .task-card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .task-expand-btn {
      border: 0;
      background: transparent;
      color: rgba(224,224,224,0.68);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    .task-expand-btn:hover {
      color: #ffffff;
    }

    .task-overflow-hint {
      font-size: 10px;
      color: rgba(224,224,224,0.48);
    }

    .thread-item {
      padding: 8px 16px 8px 42px;
      display: flex;
      align-items: center;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s ease;
      border-left: 2px solid transparent;
    }

    .thread-item:hover {
      background: var(--hover);
      color: var(--text);
      border-left-color: var(--accent);
    }

    .thread-item.active {
      background: rgba(88, 166, 255, 0.12);
      color: var(--text);
      border-left-color: var(--accent);
    }

    .agent-icon {
      width: 14px;
      height: 14px;
      margin-right: 10px;
      opacity: 0.7;
    }

    .thread-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .thread-id {
      font-weight: 500;
      color: var(--text);
    }

    .thread-status {
      font-size: 10px;
      opacity: 0.6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 8px;
      background: #888;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    .status-dot.working { background: #3fb950; box-shadow: 0 0 8px rgba(63, 185, 80, 0.4); }
    .status-dot.thinking { background: var(--accent); box-shadow: 0 0 8px rgba(88, 166, 255, 0.4); }
    .status-dot.error { background: var(--danger); box-shadow: 0 0 8px rgba(248, 81, 73, 0.4); }

    .workspace-document-host {
      min-width: 0;
    }

    .workspace-document-panel {
      min-width: 0;

</head>
<body>
  <div id="container">
    <div id="header">
      <span>Workspaces</span>
      <div id="close-sessions" style="cursor:pointer; opacity:0.6; font-size: 18px;">&times;</div>
    </div>
    <div id="workspace-list">
      <div class="empty-hint">No active workspaces</div>
    </div>
  </div>

  <script>
    const listEl = document.getElementById('workspace-list');
    let expandedWorkspaceCwd = null;
    let latestPayload = { entries: [], focusedSessionId: null, workspaceTaskViews: {} };
    let shouldAutoExpandWorkspace = true;
    let lastRenderKey = '';
    let renderQueued = false;
    let workspaceNodeMap = new Map();
    let activeWorkspaceTreeKey = null;
    const UNASSIGNED_WORKSPACE_KEY = '__clawd_unassigned__';
    const WORKSPACE_ICON = `
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
        <path class="folder-path" d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3h-6.5l-1.5-2H1.75Z"/>
        <path class="arrow-path" d="M4.47 6.22a.75.75 0 0 1 1.06 0L8 8.69l2.47-2.47a.75.75 0 1 1 1.06 1.06l-3 3a.75.75 0 0 1-1.06 0l-3-3a.75.75 0 0 1 0-1.06Z"/>
      </svg>
    `;
    const DELETE_WORKSPACE_ICON = `<svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M6.75 1.5h2.5c.69 0 1.25.56 1.25 1.25V3h2a.75.75 0 0 1 0 1.5h-.56l-.61 8.01A1.75 1.75 0 0 1 9.58 14H6.42a1.75 1.75 0 0 1-1.74-1.49L4.06 4.5H3.5a.75.75 0 0 1 0-1.5h2v-.25c0-.69.56-1.25 1.25-1.25Zm2.25 1.5h-2V3h2v-.01Zm-2.57 9.38a.75.75 0 0 0 1.5-.1l-.35-5.25a.75.75 0 1 0-1.5.1l.35 5.25Zm3.49-.1a.75.75 0 0 0 1.5.1l.35-5.25a.75.75 0 1 0-1.5-.1l-.35 5.25Z"/></svg>`;
    const CREATE_PROCESS_ICON = `<svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M3.75 1A1.75 1.75 0 0 0 2 2.75v9.5C2 13.216 2.784 14 3.75 14h8.5A1.75 1.75 0 0 0 14 12.25v-3.5a.75.75 0 0 0-1.5 0v3.5a.25.25 0 0 1-.25.25h-8.5a.25.25 0 0 1-.25-.25v-9.5a.25.25 0 0 1 .25-.25h3.5a.75.75 0 0 0 0-1.5h-3.5ZM10.5 1.75a.75.75 0 0 1 1.5 0V4h2.25a.75.75 0 0 1 0 1.5H12v2.25a.75.75 0 0 1-1.5 0V5.5H8.25a.75.75 0 0 1 0-1.5h2.25V1.75Z"/></svg>`;
    
    const AGENT_ICONS = {
      claude: `<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM4.5 5.5a1 1 0 1 1 2 0 1 1 0 0 1-2 0ZM7.5 5.5a1 1 0 1 1 2 0 1 1 0 0 1-2 0ZM11.5 5.5a1 1 0 1 1 2 0 1 1 0 0 1-2 0ZM8 12a4 4 0 0 1-3.5-2h7A4 4 0 0 1 8 12Z"/></svg>`,
      codex: `<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25V2.75Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25H1.75ZM7.25 8h1.5a.75.75 0 0 1 0 1.5h-1.5a.75.75 0 0 1 0-1.5ZM6 4.75A.75.75 0 0 1 6.75 4h2.5a.75.75 0 0 1 0 1.5h-2.5A.75.75 0 0 1 6 4.75Z"/></svg>`,
      default: `<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2 1H6a3 3 0 0 0-3 3v1h10v-1a3 3 0 0 0-3-3Z"/></svg>`
    };
    const WORKSPACE_TREE_FOLDER_ICON = `<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M1.75 2A1.75 1.75 0 0 0 0 3.75v8.5C0 13.216.784 14 1.75 14h12.5A1.75 1.75 0 0 0 16 12.25v-6.5A1.75 1.75 0 0 0 14.25 4h-6.5l-1.5-2H1.75Z"/></svg>`;
    const WORKSPACE_TREE_FILE_ICON = `<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M3.75 1A1.75 1.75 0 0 0 2 2.75v10.5C2 14.216 2.784 15 3.75 15h8.5A1.75 1.75 0 0 0 14 13.25V5.56a1.75 1.75 0 0 0-.513-1.237L10.677 1.513A1.75 1.75 0 0 0 9.44 1H3.75Zm5.5 1.06 2.62 2.62h-2.62V2.06Z"/></svg>`;
    const WORKSPACE_TREE_EXPANDED_ICON = '▾';
    const WORKSPACE_TREE_COLLAPSED_ICON = '▸';
    const WORKSPACE_TREE_STATE = new Map();
    const WORKSPACE_DOCUMENT_STATE = new Map();
    let workspaceTreeMenuEl = null;
    let workspaceTreeMenuCloseHandler = null;
    const DOCUMENT_EMPTY_HINT = 'Select a file from the workspace tree to open the embedded workbench.';
    const PDF_PRESET_ZOOMS = [70, 85, 100, 125, 150, 175];
    const MARKDOWN_TOOLBAR_ITEMS = [
      { title: 'Heading', label: 'H', action: (textarea) => applyLinePrefix(textarea, '# ') },
      { title: 'Bold', label: 'B', action: (textarea) => wrapTextareaSelection(textarea, '**', '**', 'bold text') },
      { title: 'Italic', label: 'I', action: (textarea) => wrapTextareaSelection(textarea, '*', '*', 'italic text') },
      { title: 'List', label: '•', action: (textarea) => applyLinePrefix(textarea, '- ') },
      { title: 'Checklist', label: '☑', action: (textarea) => applyLinePrefix(textarea, '- [ ] ') },
      { title: 'Quote', label: '❞', action: (textarea) => applyLinePrefix(textarea, '> ') },
      { title: 'Link', label: '🔗', action: (textarea) => wrapTextareaSelection(textarea, '[', '](https://example.com)', 'link text') },
      { title: 'Code', label: '</>', action: (textarea) => wrapTextareaSelection(textarea, '`', '`', 'code') },
    ];

    /**
     * Normalize the IPC payload into the renderer shape.
     *
     * @param {Array<object> | { entries?: Array<object>, focusedSessionId?: string | null } | null | undefined} payload
     * @returns {{ entries: Array<object>, focusedSessionId: string | null, workspaceTaskViews: Record<string, object> }}
     */
    function normalizePayload(payload) {
      if (Array.isArray(payload)) {
        return { entries: payload, focusedSessionId: null, workspaceTaskViews: {} };
      }

      return {
        entries: Array.isArray(payload?.entries) ? payload.entries : [],
        focusedSessionId: payload?.focusedSessionId ?? null,
        workspaceTaskViews: payload?.workspaceTaskViews && typeof payload.workspaceTaskViews === 'object'
          ? payload.workspaceTaskViews
          : {}
      };
    }

    /**
     * Build a stable render key so repeated payloads do not trigger extra DOM work.
     *
     * @param {{ entries: Array<object>, focusedSessionId: string | null, workspaceTaskViews: Record<string, object> }} payload
     * @returns {string}
     */
    function buildPayloadKey(payload) {
      const workspaceTaskViewEntries = Object.entries(payload.workspaceTaskViews || {})
        .sort(([left], [right]) => left.localeCompare(right))
        .map(([cwd, view]) => [cwd, view && typeof view.renderKey === 'string' ? view.renderKey : JSON.stringify(view)]);

      return [
        payload.focusedSessionId || '',
        ...payload.entries.map((entry) => [
          entry.id,
          entry.state,
          entry.updatedAt,
          entry.cwd,
          entry.workspaceKey || '',
          entry.agentId || '',
          entry.lastEvent || '',
          entry.isStatic ? 1 : 0,
          entry.isActive ? 1 : 0,
          entry.isFocused ? 1 : 0
        ].join('~')),
        JSON.stringify(workspaceTaskViewEntries)
      ].join('||');
    }

    /**
     * Apply the current expanded workspace state without rebuilding the full list.
     *
     * @returns {void}
     */
    function applyExpandedWorkspaceState() {
      workspaceNodeMap.forEach(({ row, threadsContainer }, cwd) => {
        const isExpanded = cwd === expandedWorkspaceCwd;
        row.classList.toggle('expanded', isExpanded);
        row.setAttribute('aria-expanded', String(isExpanded));
        threadsContainer.classList.toggle('expanded', isExpanded);
      });
    }

    /**
     * Expand or collapse a workspace using the existing DOM nodes.
     *
     * @param {string | null} nextCwd
     * @param {{ manual?: boolean }} [options]
     * @returns {void}
     */
    function setExpandedWorkspace(nextCwd, options = {}) {
      expandedWorkspaceCwd = nextCwd;
      if (options.manual) {
        shouldAutoExpandWorkspace = false;
      }
      if (nextCwd) {
        activeWorkspaceTreeKey = nextCwd;
      }
      applyExpandedWorkspaceState();
      if (nextCwd) {
        const nodeEntry = workspaceNodeMap.get(nextCwd);
        if (nodeEntry) {
          renderWorkspaceTreePanel(nodeEntry, nextCwd, nodeEntry.cwd || '', { deferLoad: false });
        }
      }
    }

    /**
     * Toggle one workspace row from pointer or keyboard input.
     *
     * @param {string} workspaceKey
     * @returns {void}
     */
    function toggleWorkspaceExpansion(workspaceKey) {
      const wasExpanded = expandedWorkspaceCwd === workspaceKey;
      setExpandedWorkspace(wasExpanded ? null : workspaceKey, { manual: true });
    }

    /**
     * Build a DOM node from trusted inline SVG markup.
     *
     * @param {string} markup
     * @param {string} [className]
     * @returns {HTMLDivElement}
     */
    function createIconNode(markup, className = '') {
      const icon = document.createElement('div');
      if (className) icon.className = className;
      icon.innerHTML = markup;
      return icon;
    }

    /**
     * Create a safe action button without inline event handlers.
     *
     * @param {string} title
     * @param {string} iconMarkup
     * @param {string} [className]
     * @returns {HTMLButtonElement}
     */
    function createActionButton(title, iconMarkup, className = '') {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = ['action-btn', className].filter(Boolean).join(' ');
      button.title = title;
      button.setAttribute('aria-label', title);
      button.innerHTML = iconMarkup;
      return button;
    }

    /**
     * Normalize one workspace-relative path for tree state.
     *
     * @param {string | null | undefined} value
     * @returns {string}
     */
    function normalizeWorkspaceRelativePath(value) {
      const raw = String(value || '').trim().replace(/\\/g, '/');
      if (!raw || raw === '.') return '';

      const parts = [];
      raw.split('/').forEach((segment) => {
        const trimmed = segment.trim();
        if (!trimmed || trimmed === '.') return;
        if (trimmed === '..') {
          parts.pop();
          return;
        }
        parts.push(trimmed);
      });

      return parts.join('/');
    }

    /**
     * Return the basename for a normalized workspace-relative path.
     *
     * @param {string | null | undefined} value
     * @returns {string}
     */
    function getWorkspaceEntryName(value) {
      const normalized = normalizeWorkspaceRelativePath(value);
      if (!normalized) return '';
      const segments = normalized.split('/');
      return segments[segments.length - 1] || '';
    }

    /**
     * Return the parent folder for a normalized workspace-relative path.
     *
     * @param {string | null | undefined} value
     * @returns {string}
     */
    function getWorkspaceParentRelativePath(value) {
      const normalized = normalizeWorkspaceRelativePath(value);
      if (!normalized) return '';
      const segments = normalized.split('/');
      segments.pop();
      return segments.join('/');
    }

    /**
     * Join one parent path with a child entry name.
     *
     * @param {string | null | undefined} parentRelativePath
     * @param {string} entryName
     * @returns {string}
     */
    function joinWorkspaceRelativePath(parentRelativePath, entryName) {
      const parent = normalizeWorkspaceRelativePath(parentRelativePath);
      const name = String(entryName || '').trim().replace(/\\/g, '/');
      return parent ? `${parent}/${name}` : name;
    }

    /**
     * Create one tree state bucket for a workspace.
     *
     * @param {string} workspaceKey
     * @param {string} cwd
     * @returns {object}
     */
    function createWorkspaceTreeState(workspaceKey, cwd) {
      return {
        workspaceKey,
        cwd,
        selectedRelativePath: '',
        expandedPaths: new Set(['']),
        directoryCache: new Map(),
        entryIndex: new Map(),
        loadingPaths: new Set(),
        loadTokens: new Map(),
        lastMessage: '',
        lastError: '',
        clipboardState: null,
        renderToken: 0,
      };
    }

    /**
     * Resolve or create one tree state bucket for a workspace.
     *
     * @param {string} workspaceKey
     * @param {string} cwd
     * @returns {object}
     */
    function ensureWorkspaceTreeState(workspaceKey, cwd) {
      const nextCwd = typeof cwd === 'string' ? cwd : '';
      const state = WORKSPACE_TREE_STATE.get(workspaceKey) || createWorkspaceTreeState(workspaceKey, nextCwd);
      state.cwd = nextCwd;
      WORKSPACE_TREE_STATE.set(workspaceKey, state);
      return state;
    }

    /**
     * Create one workbench state bucket for a workspace.
     *
     * @param {string} workspaceKey
     * @param {string} cwd
     * @returns {object}
     */
    function createWorkspaceDocumentState(workspaceKey, cwd) {
      return {
        workspaceKey,
        cwd,
        activeRelativePath: '',
        document: null,
        draftContent: '',
        lastSavedContent: '',
        dirty: false,
        loading: false,
        saving: false,
        compiling: false,
        error: '',
        statusMessage: '',
        previewMode: 'edit',
        pdfView: {
          page: 1,
          pageCount: null,
          zoom: 100,
        },
        texCompileResult: null,
      };
    }

    /**
     * Resolve or create one workbench state bucket for a workspace.
     *
     * @param {string} workspaceKey
     * @param {string} cwd
     * @returns {object}
     */
    function ensureWorkspaceDocumentState(workspaceKey, cwd) {
      const nextCwd = typeof cwd === 'string' ? cwd : '';
      const state = WORKSPACE_DOCUMENT_STATE.get(workspaceKey) || createWorkspaceDocumentState(workspaceKey, nextCwd);
      state.cwd = nextCwd;
      WORKSPACE_DOCUMENT_STATE.set(workspaceKey, state);
      return state;
    }

    /**
     * Return whether the active document should render with a line-number gutter.
     *
     * @param {object | null} document
     * @returns {boolean}
     */
    function shouldShowDocumentLineNumbers(document) {
      return document?.mode === 'code' || document?.mode === 'tex';
    }

    /**
     * Escape a text fragment for safe HTML interpolation.
     *
     * @param {string} value
     * @returns {string}
     */
    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Render a compact inline Markdown subset into trusted HTML.
     *
     * @param {string} value
     * @returns {string}
     */
    function renderInlineMarkdownHtml(value) {
      let html = escapeHtml(value);
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      html = html.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
      return html;
    }

    /**
     * Build one Markdown preview fragment from raw editor text.
     *
     * @param {string} value
     * @returns {DocumentFragment}
     */
    function buildMarkdownPreviewFragment(value) {
      const fragment = document.createDocumentFragment();
      const lines = String(value || '').replace(/\r\n/g, '\n').split('\n');
      let index = 0;

      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) {
          index += 1;
          continue;
        }

        const fenceMatch = line.match(/^```(.*)$/);
        if (fenceMatch) {
          const content = [];
          index += 1;
          while (index < lines.length && !/^```/.test(lines[index])) {
            content.push(lines[index]);
            index += 1;
          }
          const pre = document.createElement('pre');
          const code = document.createElement('code');
          code.textContent = content.join('\n');
          pre.appendChild(code);
          fragment.appendChild(pre);
          index += 1;
          continue;
        }

        const headingMatch = line.match(/^(#{1,4})\s+(.+)$/);
        if (headingMatch) {
          const heading = document.createElement(`h${headingMatch[1].length}`);
          heading.innerHTML = renderInlineMarkdownHtml(headingMatch[2]);
          fragment.appendChild(heading);
          index += 1;
          continue;
        }

        if (/^---+$/.test(line.trim()) || /^\*\*\*+$/.test(line.trim())) {
          fragment.appendChild(document.createElement('hr'));
          index += 1;
          continue;
        }

        if (/^>\s?/.test(line)) {
          const quoteLines = [];
          while (index < lines.length && /^>\s?/.test(lines[index])) {
            quoteLines.push(lines[index].replace(/^>\s?/, ''));
            index += 1;
          }
          const blockquote = document.createElement('blockquote');
          blockquote.innerHTML = renderInlineMarkdownHtml(quoteLines.join(' '));
          fragment.appendChild(blockquote);
          continue;
        }

        if (/^(\s*[-*]\s+|\s*\d+\.\s+)/.test(line)) {
          const ordered = /^\s*\d+\.\s+/.test(line);
          const list = document.createElement(ordered ? 'ol' : 'ul');
          while (index < lines.length && /^(\s*[-*]\s+|\s*\d+\.\s+)/.test(lines[index])) {
            const item = document.createElement('li');
            item.innerHTML = renderInlineMarkdownHtml(lines[index].replace(/^(\s*[-*]\s+|\s*\d+\.\s+)/, ''));
            list.appendChild(item);
            index += 1;
          }
          fragment.appendChild(list);
          continue;
        }

        const paragraphLines = [];
        while (index < lines.length && lines[index].trim() && !/^(#{1,4})\s+/.test(lines[index]) && !/^```/.test(lines[index]) && !/^>\s?/.test(lines[index]) && !/^(\s*[-*]\s+|\s*\d+\.\s+)/.test(lines[index]) && !/^---+$/.test(lines[index].trim()) && !/^\*\*\*+$/.test(lines[index].trim())) {
          paragraphLines.push(lines[index].trim());
          index += 1;
        }
        const paragraph = document.createElement('p');
        paragraph.innerHTML = renderInlineMarkdownHtml(paragraphLines.join(' '));
        fragment.appendChild(paragraph);
      }

      if (!fragment.childNodes.length) {
        const empty = document.createElement('div');
        empty.className = 'workspace-document-empty';
        empty.textContent = 'Markdown preview is empty.';
        fragment.appendChild(empty);
      }

      return fragment;
    }

    /**
     * Apply one textarea replacement while preserving selection and dispatching input.
     *
     * @param {HTMLTextAreaElement} textarea
     * @param {string} nextValue
     * @param {number} selectionStart
     * @param {number} selectionEnd
     * @returns {void}
     */
    function commitTextareaEdit(textarea, nextValue, selectionStart, selectionEnd) {
      textarea.value = nextValue;
      textarea.focus();
      textarea.setSelectionRange(selectionStart, selectionEnd);
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
    }

    /**
     * Wrap the current textarea selection with prefix and suffix.
     *
     * @param {HTMLTextAreaElement} textarea
     * @param {string} prefix
     * @param {string} suffix
     * @param {string} placeholder
     * @returns {void}
     */
    function wrapTextareaSelection(textarea, prefix, suffix, placeholder) {
      const start = textarea.selectionStart || 0;
      const end = textarea.selectionEnd || 0;
      const rawValue = textarea.value || '';
      const selected = rawValue.slice(start, end) || placeholder;
      const nextValue = `${rawValue.slice(0, start)}${prefix}${selected}${suffix}${rawValue.slice(end)}`;
      const nextStart = start + prefix.length;
      const nextEnd = nextStart + selected.length;
      commitTextareaEdit(textarea, nextValue, nextStart, nextEnd);
    }

    /**
     * Prefix each selected line in the textarea with one marker.
     *
     * @param {HTMLTextAreaElement} textarea
     * @param {string} prefix
     * @returns {void}
     */
    function applyLinePrefix(textarea, prefix) {
      const start = textarea.selectionStart || 0;
      const end = textarea.selectionEnd || 0;
      const rawValue = textarea.value || '';
      const blockStart = rawValue.lastIndexOf('\n', Math.max(0, start - 1)) + 1;
      const blockEndIndex = rawValue.indexOf('\n', end);
      const blockEnd = blockEndIndex === -1 ? rawValue.length : blockEndIndex;
      const target = rawValue.slice(blockStart, blockEnd);
      const nextBlock = target
        .split('\n')
        .map((line) => `${prefix}${line}`)
        .join('\n');
      const nextValue = `${rawValue.slice(0, blockStart)}${nextBlock}${rawValue.slice(blockEnd)}`;
      commitTextareaEdit(textarea, nextValue, blockStart, blockStart + nextBlock.length);
    }

    /**
     * Update one editor gutter to match the current line count.
     *
     * @param {HTMLElement | null} gutterEl
     * @param {string} value
     * @returns {void}
     */
    function syncWorkspaceEditorGutter(gutterEl, value) {
      if (!gutterEl) return;
      const lineCount = Math.max(1, String(value || '').split('\n').length);
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < lineCount; index += 1) {
        const line = document.createElement('div');
        line.textContent = String(index + 1);
        fragment.appendChild(line);
      }
      gutterEl.replaceChildren(fragment);
    }

    /**
     * Refresh the header controls bound to one workbench instance.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @returns {void}
     */
    function refreshWorkspaceDocumentUiState(nodeEntry, state) {
      const ui = nodeEntry.documentUi;
      if (!ui) return;
      if (ui.badgeEl) {
        const modeLabel = state.document?.mode === 'pdf'
          ? 'PDF'
          : state.document?.mode === 'tex'
            ? 'TeX'
            : state.document?.mode === 'markdown'
              ? 'Markdown'
              : state.document?.mode === 'code'
                ? 'Code'
                : 'Text';
        ui.badgeEl.textContent = state.dirty ? `${modeLabel} • dirty` : modeLabel;
        ui.badgeEl.classList.toggle('dirty', !!state.dirty);
      }
      if (ui.statusEl) {
        ui.statusEl.textContent = state.error || state.statusMessage || '';
        ui.statusEl.classList.toggle('error', !!state.error);
      }
      if (ui.saveBtn) {
        ui.saveBtn.disabled = !state.document || !state.document.isEditable || !state.dirty || state.saving || state.loading;
      }
      if (ui.compileBtn) {
        ui.compileBtn.disabled = state.loading || state.saving || state.compiling;
      }
    }

    /**
     * Clear loaded directory data while preserving selection and expansion.
     *
     * @param {object} state
     * @returns {void}
     */
    function resetWorkspaceTreeState(state) {
      state.directoryCache.clear();
      state.entryIndex.clear();
      state.loadingPaths.clear();
      state.loadTokens.clear();
      state.lastError = '';
      state.lastMessage = 'Refreshing workspace tree...';
      state.renderToken += 1;
    }

    /**
     * Return the current selected entry and its parent target.
     *
     * @param {object} state
     * @returns {{ relativePath: string | null, kind: string | null, parentRelativePath: string }}
     */
    function getWorkspaceTreeSelection(state) {
      const relativePath = normalizeWorkspaceRelativePath(state.selectedRelativePath);
      if (!relativePath) {
        return { relativePath: null, kind: null, parentRelativePath: '' };
      }

      const entry = state.entryIndex.get(relativePath) || null;
      return {
        relativePath,
        kind: entry?.kind || null,
        parentRelativePath: entry?.kind === 'directory' ? relativePath : getWorkspaceParentRelativePath(relativePath),
      };
    }

    /**
     * Return the best paste target for the current selection.
     *
     * @param {object} state
     * @returns {string}
     */
    function resolveWorkspaceTreePasteTarget(state) {
      const selection = getWorkspaceTreeSelection(state);
      if (selection.relativePath && selection.kind === 'directory') {
        return selection.relativePath;
      }
      return selection.parentRelativePath || '';
    }

    /**
     * Update the visible footer for one workspace tree.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @returns {void}
     */
    function updateWorkspaceTreeFooter(nodeEntry, state) {
      if (!nodeEntry?.treeFooterEl) return;

      const clipboardLabel = state.clipboardState?.hasItem
        ? `${state.clipboardState.mode === 'cut' ? 'Cut' : 'Copy'} ${state.clipboardState.name || state.clipboardState.relativePath || ''}`.trim()
        : 'Clipboard empty';

      const selection = getWorkspaceTreeSelection(state);
      const selectionLabel = selection.relativePath
        ? `${selection.kind === 'directory' ? 'Folder' : 'File'}: ${selection.relativePath}`
        : 'Workspace root';

      const parts = [clipboardLabel, selectionLabel];
      if (state.lastError) parts.push(`Error: ${state.lastError}`);
      else if (state.lastMessage) parts.push(state.lastMessage);

      nodeEntry.treeFooterEl.innerHTML = '';
      const status = document.createElement('div');
      status.className = 'workspace-tree-status';
      parts.forEach((part) => {
        const span = document.createElement('span');
        if (part.startsWith('Error: ')) {
          span.style.color = '#ff8a8a';
        }
        span.textContent = part;
        status.appendChild(span);
      });
      nodeEntry.treeFooterEl.appendChild(status);
    }

    /**
     * Request the current clipboard metadata from the host.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @returns {Promise<void>}
     */
    async function syncWorkspaceTreeClipboardState(nodeEntry, state) {
      try {
        state.clipboardState = await window.sessionsAPI.getWorkspaceClipboard();
      } catch (error) {
        state.clipboardState = null;
        state.lastError = error?.message || String(error);
      }
      updateWorkspaceTreeFooter(nodeEntry, state);
    }

    /**
     * Convert one API entry into tree state metadata.
     *
     * @param {string} parentRelativePath
     * @param {object} entry
     * @returns {{ name: string, relativePath: string, absolutePath: string, kind: string }}
     */
    function normalizeWorkspaceTreeEntry(parentRelativePath, entry) {
      const relativePath = normalizeWorkspaceRelativePath(entry?.relativePath || joinWorkspaceRelativePath(parentRelativePath, entry?.name || ''));
      const absolutePath = typeof entry?.absolutePath === 'string'
        ? entry.absolutePath
        : '';
      return {
        name: String(entry?.name || getWorkspaceEntryName(relativePath)),
        relativePath,
        absolutePath,
        kind: entry?.kind === 'directory' ? 'directory' : 'file',
      };
    }

    /**
     * Store one directory listing in the tree cache.
     *
     * @param {object} state
     * @param {string} relativePath
     * @param {Array<object>} entries
     * @returns {void}
     */
    function storeWorkspaceTreeDirectory(state, relativePath, entries) {
      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      const normalizedEntries = entries.map((entry) => normalizeWorkspaceTreeEntry(normalizedPath, entry));
      state.directoryCache.set(normalizedPath, {
        loaded: true,
        loading: false,
        error: '',
        entries: normalizedEntries,
      });
      normalizedEntries.forEach((entry) => {
        state.entryIndex.set(entry.relativePath, entry);
      });
    }

    /**
     * Return one cached directory snapshot, if any.
     *
     * @param {object} state
     * @param {string} relativePath
     * @returns {{ loaded: boolean, loading: boolean, error: string, entries: Array<object> } | null}
     */
    function getWorkspaceTreeDirectory(state, relativePath) {
      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      return state.directoryCache.get(normalizedPath) || null;
    }

    /**
     * Schedule a tree repaint and coalesce async refreshes.
     *
     * @param {object} nodeEntry
     * @returns {void}
     */
    function scheduleWorkspaceTreeRender(nodeEntry) {
      nodeEntry.treeRenderQueued = true;
      requestAnimationFrame(() => {
        if (!nodeEntry.treeRenderQueued) return;
        nodeEntry.treeRenderQueued = false;
        renderWorkspaceTreePanel(nodeEntry, nodeEntry.workspaceKey, nodeEntry.cwd);
      });
    }

    /**
     * Load one directory listing into the cache.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {string} relativePath
     * @param {{ force?: boolean }} [options]
     * @returns {Promise<void>}
     */
    async function loadWorkspaceTreeDirectory(nodeEntry, state, relativePath, options = {}) {
      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      const current = state.directoryCache.get(normalizedPath);
      if (current?.loaded && !options.force) return;
      if (state.loadingPaths.has(normalizedPath) && !options.force) return;

      const nextToken = (state.loadTokens.get(normalizedPath) || 0) + 1;
      state.loadTokens.set(normalizedPath, nextToken);
      state.loadingPaths.add(normalizedPath);
      state.directoryCache.set(normalizedPath, {
        loaded: false,
        loading: true,
        error: '',
        entries: current?.entries || [],
      });
      state.lastMessage = normalizedPath ? `Loading ${normalizedPath || '.'}...` : 'Loading workspace tree...';
      scheduleWorkspaceTreeRender(nodeEntry);

      try {
        const response = await window.sessionsAPI.listWorkspaceEntries({
          cwd: state.cwd,
          relativePath: normalizedPath || null,
        });
        if (state.loadTokens.get(normalizedPath) !== nextToken) return;
        const entries = Array.isArray(response?.entries) ? response.entries : [];
        storeWorkspaceTreeDirectory(state, normalizedPath, entries);
        state.lastMessage = normalizedPath ? `Loaded ${normalizedPath || '.'}` : 'Workspace tree ready';
        state.lastError = '';
      } catch (error) {
        if (state.loadTokens.get(normalizedPath) !== nextToken) return;
        state.directoryCache.set(normalizedPath, {
          loaded: false,
          loading: false,
          error: error?.message || String(error),
          entries: [],
        });
        state.lastError = error?.message || String(error);
      } finally {
        state.loadingPaths.delete(normalizedPath);
        scheduleWorkspaceTreeRender(nodeEntry);
      }
    }

    /**
     * Render one tree row with folder/file affordances.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {object} entry
     * @param {number} depth
     * @returns {HTMLDivElement}
     */
    function createWorkspaceTreeRow(nodeEntry, state, entry, depth) {
      const row = document.createElement('div');
      row.className = `workspace-tree-item is-${entry.kind}${state.selectedRelativePath === entry.relativePath ? ' selected' : ''}`;
      row.style.paddingLeft = `${8 + depth * 14}px`;
      row.dataset.relativePath = entry.relativePath;
      row.dataset.kind = entry.kind;

      const disclosure = document.createElement('button');
      disclosure.type = 'button';
      disclosure.className = 'workspace-tree-disclosure';
      disclosure.textContent = entry.kind === 'directory'
        ? (state.expandedPaths.has(entry.relativePath) ? WORKSPACE_TREE_EXPANDED_ICON : WORKSPACE_TREE_COLLAPSED_ICON)
        : '';
      if (entry.kind !== 'directory') {
        disclosure.classList.add('is-hidden');
      } else {
        disclosure.addEventListener('click', (event) => {
          event.stopPropagation();
          toggleWorkspaceTreeDirectory(nodeEntry, state, entry.relativePath);
        });
      }

      const icon = document.createElement('div');
      icon.className = 'workspace-tree-item-icon';
      icon.innerHTML = entry.kind === 'directory' ? WORKSPACE_TREE_FOLDER_ICON : WORKSPACE_TREE_FILE_ICON;

      const name = document.createElement('div');
      name.className = 'workspace-tree-item-name';
      name.textContent = entry.name;
      name.title = entry.relativePath;

      const meta = document.createElement('div');
      meta.className = 'workspace-tree-item-meta';
      meta.textContent = entry.kind === 'directory' ? 'dir' : 'file';

      row.append(disclosure, icon, name, meta);

      row.addEventListener('click', (event) => {
        event.stopPropagation();
        setWorkspaceTreeSelection(nodeEntry, state, entry.relativePath);
      });

      row.addEventListener('dblclick', (event) => {
        event.preventDefault();
        event.stopPropagation();
        setWorkspaceTreeSelection(nodeEntry, state, entry.relativePath);
        if (entry.kind === 'directory') {
          toggleWorkspaceTreeDirectory(nodeEntry, state, entry.relativePath);
        } else {
          void runWorkspaceTreeOpenEntry(nodeEntry, state, entry.relativePath);
        }
      });

      row.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        event.stopPropagation();
        setWorkspaceTreeSelection(nodeEntry, state, entry.relativePath);
        openWorkspaceTreeContextMenu(nodeEntry, state, entry.relativePath, event);
      });

      return row;
    }

    /**
     * Update the selected tree entry and refresh the visible state.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {string} relativePath
     * @param {{ openMenu?: boolean, focusMenu?: boolean }} [options]
     * @returns {void}
     */
    function setWorkspaceTreeSelection(nodeEntry, state, relativePath, options = {}) {
      state.selectedRelativePath = normalizeWorkspaceRelativePath(relativePath);
      nodeEntry.selectedTreePath = state.selectedRelativePath;
      state.lastMessage = state.selectedRelativePath ? `Selected ${state.selectedRelativePath}` : 'Selected workspace root';
      state.lastError = '';
      activeWorkspaceTreeKey = state.workspaceKey;
      updateWorkspaceTreeFooter(nodeEntry, state);
      renderWorkspaceTreePanel(nodeEntry, state.workspaceKey, state.cwd);
      const entry = state.entryIndex.get(state.selectedRelativePath);
      if (entry?.kind === 'file') {
        const documentState = ensureWorkspaceDocumentState(state.workspaceKey, state.cwd);
        void openWorkspaceDocument(nodeEntry, documentState, entry.relativePath);
      }
      if (options.openMenu) {
        const fallbackEvent = {
          clientX: 0,
          clientY: 0,
          preventDefault() {},
        };
        openWorkspaceTreeContextMenu(nodeEntry, state, state.selectedRelativePath, fallbackEvent);
      }
    }

    /**
     * Toggle one directory open or closed.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {string} relativePath
     * @returns {void}
     */
    function toggleWorkspaceTreeDirectory(nodeEntry, state, relativePath) {
      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      if (state.expandedPaths.has(normalizedPath)) {
        state.expandedPaths.delete(normalizedPath);
        state.lastMessage = `Collapsed ${normalizedPath}`;
        renderWorkspaceTreePanel(nodeEntry, state.workspaceKey, state.cwd);
        return;
      }

      state.expandedPaths.add(normalizedPath);
      state.lastMessage = `Expanded ${normalizedPath}`;
      renderWorkspaceTreePanel(nodeEntry, state.workspaceKey, state.cwd);
      void loadWorkspaceTreeDirectory(nodeEntry, state, normalizedPath);
    }

    /**
     * Remove the current tree context menu, if present.
     *
     * @returns {void}
     */
    function closeWorkspaceTreeContextMenu() {
      if (workspaceTreeMenuEl) {
        workspaceTreeMenuEl.remove();
        workspaceTreeMenuEl = null;
      }
      if (workspaceTreeMenuCloseHandler) {
        window.removeEventListener('pointerdown', workspaceTreeMenuCloseHandler, true);
        window.removeEventListener('blur', workspaceTreeMenuCloseHandler);
        window.removeEventListener('resize', workspaceTreeMenuCloseHandler);
        window.removeEventListener('scroll', workspaceTreeMenuCloseHandler, true);
        document.removeEventListener('keydown', workspaceTreeMenuCloseHandler, true);
        workspaceTreeMenuCloseHandler = null;
      }
    }

    /**
     * Create one menu item for the tree context menu.
     *
     * @param {string} label
     * @param {string} shortcut
     * @param {() => void | Promise<void>} onClick
     * @param {boolean} disabled
     * @returns {HTMLButtonElement}
     */
    function createWorkspaceTreeMenuItem(label, shortcut, onClick, disabled = false) {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'workspace-context-menu-item';
      item.disabled = disabled;

      const labelSpan = document.createElement('span');
      labelSpan.className = 'workspace-context-menu-label';
      labelSpan.textContent = label;
      item.appendChild(labelSpan);

      const shortcutSpan = document.createElement('span');
      shortcutSpan.className = 'workspace-context-menu-shortcut';
      shortcutSpan.textContent = shortcut;
      item.appendChild(shortcutSpan);

      item.addEventListener('click', async (event) => {
        event.stopPropagation();
        if (disabled) return;
        closeWorkspaceTreeContextMenu();
        await onClick();
      });

      return item;
    }

    /**
     * Open the tree context menu for one entry.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {string} relativePath
     * @param {{ clientX?: number, clientY?: number }} anchor
     * @returns {void}
     */
    function openWorkspaceTreeContextMenu(nodeEntry, state, relativePath, anchor) {
      closeWorkspaceTreeContextMenu();

      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      const entry = state.entryIndex.get(normalizedPath) || null;
      const hasSelection = !!normalizedPath;
      const isDirectory = entry?.kind === 'directory';
      const pasteTarget = isDirectory ? normalizedPath : getWorkspaceParentRelativePath(normalizedPath);
      const clipboardState = state.clipboardState;

      const menu = document.createElement('div');
      menu.className = 'workspace-context-menu';

      const items = [
        createWorkspaceTreeMenuItem('Cut', '⌘X', async () => runWorkspaceTreeClipboardOperation(nodeEntry, state, 'cut', normalizedPath), !hasSelection),
        createWorkspaceTreeMenuItem('Copy', '⌘C', async () => runWorkspaceTreeClipboardOperation(nodeEntry, state, 'copy', normalizedPath), !hasSelection),
        createWorkspaceTreeMenuItem('Paste', '⌘V', async () => runWorkspaceTreePasteOperation(nodeEntry, state, pasteTarget), !clipboardState?.hasItem),
        createWorkspaceTreeMenuItem('Copy relative path', '⌥⌘C', async () => runWorkspaceTreeCopyPath(nodeEntry, state, normalizedPath, 'relative'), !hasSelection),
        createWorkspaceTreeMenuItem('Copy absolute path', '⌥⇧⌘C', async () => runWorkspaceTreeCopyPath(nodeEntry, state, normalizedPath, 'absolute'), !hasSelection),
        createWorkspaceTreeMenuItem('Delete', '⌘⌫', async () => runWorkspaceTreeDeleteOperation(nodeEntry, state, normalizedPath), !hasSelection),
        createWorkspaceTreeMenuItem('Rename', '↩', async () => runWorkspaceTreeRenameOperation(nodeEntry, state, normalizedPath), !hasSelection),
      ];

      items.forEach((item) => menu.appendChild(item));
      document.body.appendChild(menu);
      workspaceTreeMenuEl = menu;

      const menuWidth = 260;
      const menuHeight = Math.min(items.length * 38 + 12, 360);
      const x = Math.min(Math.max(12, Number(anchor?.clientX || 0)), window.innerWidth - menuWidth - 12);
      const y = Math.min(Math.max(12, Number(anchor?.clientY || 0)), window.innerHeight - menuHeight - 12);
      menu.style.left = `${x}px`;
      menu.style.top = `${y}px`;

      workspaceTreeMenuCloseHandler = (event) => {
        if (workspaceTreeMenuEl && !workspaceTreeMenuEl.contains(event.target)) {
          closeWorkspaceTreeContextMenu();
        }
      };
      window.addEventListener('pointerdown', workspaceTreeMenuCloseHandler, true);
      window.addEventListener('blur', workspaceTreeMenuCloseHandler);
      window.addEventListener('resize', workspaceTreeMenuCloseHandler);
      window.addEventListener('scroll', workspaceTreeMenuCloseHandler, true);
      document.addEventListener('keydown', workspaceTreeMenuCloseHandler, true);
    }

    /**
     * Copy or cut one tree entry into the host clipboard.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {'cut' | 'copy'} mode
     * @param {string} relativePath
     * @returns {Promise<void>}
     */
    async function runWorkspaceTreeClipboardOperation(nodeEntry, state, mode, relativePath) {
      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      if (!normalizedPath) return;
      await window.sessionsAPI.setWorkspaceClipboard({
        cwd: state.cwd,
        relativePath: normalizedPath,
        mode,
      });
      state.clipboardState = await window.sessionsAPI.getWorkspaceClipboard();
      state.lastMessage = `${mode === 'cut' ? 'Cut' : 'Copied'} ${normalizedPath}`;
      state.lastError = '';
      updateWorkspaceTreeFooter(nodeEntry, state);
      renderWorkspaceTreePanel(nodeEntry, state.workspaceKey, state.cwd);
    }

    /**
     * Paste the current clipboard into one target directory.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {string} targetRelativePath
     * @returns {Promise<void>}
     */
    async function runWorkspaceTreePasteOperation(nodeEntry, state, targetRelativePath) {
      try {
        const result = await window.sessionsAPI.pasteWorkspaceClipboard({
          cwd: state.cwd,
          targetRelativePath: normalizeWorkspaceRelativePath(targetRelativePath) || null,
        });
        state.clipboardState = await window.sessionsAPI.getWorkspaceClipboard();
        state.lastMessage = `Pasted ${result?.relativePath || 'entry'}`;
        state.lastError = '';
        await refreshWorkspaceTreePanel(nodeEntry, state, { keepSelection: true });
      } catch (error) {
        state.lastError = error?.message || String(error);
        updateWorkspaceTreeFooter(nodeEntry, state);
      }
    }

    /**
     * Copy one entry path in the requested format.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {string} relativePath
     * @param {'relative' | 'absolute'} format
     * @returns {Promise<void>}
     */
    async function runWorkspaceTreeCopyPath(nodeEntry, state, relativePath, format) {
      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      if (!normalizedPath) return;
      await window.sessionsAPI.copyWorkspacePath({
        cwd: state.cwd,
        relativePath: normalizedPath,
        format,
      });
      state.lastMessage = `Copied ${format} path`;
      state.lastError = '';
      updateWorkspaceTreeFooter(nodeEntry, state);
    }

    /**
     * Open one file entry from the workspace tree.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {string} relativePath
     * @returns {Promise<void>}
     */
    async function runWorkspaceTreeOpenEntry(nodeEntry, state, relativePath) {
      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      if (!normalizedPath) return;

      try {
        const documentState = ensureWorkspaceDocumentState(state.workspaceKey, state.cwd);
        await openWorkspaceDocument(nodeEntry, documentState, normalizedPath, { force: true });
        state.lastMessage = `Opened ${normalizedPath}`;
        state.lastError = '';
      } catch (error) {
        state.lastError = error?.message || String(error);
      }

      updateWorkspaceTreeFooter(nodeEntry, state);
    }

    /**
     * Rename one entry through the host API.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {string} relativePath
     * @returns {Promise<void>}
     */
    async function runWorkspaceTreeRenameOperation(nodeEntry, state, relativePath) {
      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      if (!normalizedPath) return;
      const currentName = getWorkspaceEntryName(normalizedPath);
      const nextName = window.prompt('Rename workspace entry', currentName);
      if (nextName == null) return;
      const trimmed = nextName.trim();
      if (!trimmed || trimmed === currentName) return;

      const result = await window.sessionsAPI.renameWorkspaceEntry({
        cwd: state.cwd,
        relativePath: normalizedPath,
        nextName: trimmed,
      });
      const nextRelativePath = normalizeWorkspaceRelativePath(result?.relativePath || joinWorkspaceRelativePath(getWorkspaceParentRelativePath(normalizedPath), trimmed));
      state.selectedRelativePath = nextRelativePath;
      state.lastMessage = `Renamed to ${getWorkspaceEntryName(state.selectedRelativePath)}`;
      state.lastError = '';
      await refreshWorkspaceTreePanel(nodeEntry, state, { keepSelection: true });
      const documentState = ensureWorkspaceDocumentState(state.workspaceKey, state.cwd);
      if (documentState.activeRelativePath === normalizedPath) {
        await openWorkspaceDocument(nodeEntry, documentState, nextRelativePath, { force: true });
      }
    }

    /**
     * Delete one entry after confirmation.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {string} relativePath
     * @returns {Promise<void>}
     */
    async function runWorkspaceTreeDeleteOperation(nodeEntry, state, relativePath) {
      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      if (!normalizedPath) return;
      const entry = state.entryIndex.get(normalizedPath);
      const label = entry?.name || normalizedPath;
      const confirmed = window.confirm(`Delete "${label}"? This cannot be undone.`);
      if (!confirmed) return;

      await window.sessionsAPI.deleteWorkspaceEntry({
        cwd: state.cwd,
        relativePath: normalizedPath,
      });
      const documentState = ensureWorkspaceDocumentState(state.workspaceKey, state.cwd);
      if (documentState.activeRelativePath === normalizedPath) {
        closeWorkspaceDocument(documentState, `Closed ${normalizedPath}`);
        renderWorkspaceDocumentPanel(nodeEntry, state.workspaceKey, state.cwd);
      }
      state.selectedRelativePath = getWorkspaceParentRelativePath(normalizedPath);
      state.lastMessage = `Deleted ${normalizedPath}`;
      state.lastError = '';
      await refreshWorkspaceTreePanel(nodeEntry, state, { keepSelection: true });
    }

    /**
     * Create one file or folder inside the selected directory.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {'file' | 'directory'} kind
     * @returns {Promise<void>}
     */
    async function runWorkspaceTreeCreateOperation(nodeEntry, state, kind) {
      const targetRelativePath = resolveWorkspaceTreePasteTarget(state);
      const entryLabel = kind === 'directory' ? 'folder' : 'file';
      const nextName = window.prompt(`New ${entryLabel} name`, kind === 'directory' ? 'new-folder' : 'new-file.txt');
      if (nextName == null) return;
      const trimmed = nextName.trim();
      if (!trimmed) return;

      const result = await window.sessionsAPI.createWorkspaceEntry({
        cwd: state.cwd,
        parentRelativePath: targetRelativePath || null,
        name: trimmed,
        kind,
      });
      const nextRelativePath = normalizeWorkspaceRelativePath(result?.relativePath || joinWorkspaceRelativePath(targetRelativePath, trimmed));
      state.selectedRelativePath = nextRelativePath;
      state.lastMessage = `Created ${state.selectedRelativePath}`;
      state.lastError = '';
      await refreshWorkspaceTreePanel(nodeEntry, state, { keepSelection: true });
      if (kind === 'file') {
        const documentState = ensureWorkspaceDocumentState(state.workspaceKey, state.cwd);
        await openWorkspaceDocument(nodeEntry, documentState, nextRelativePath, { force: true });
      }
    }

    /**
     * Refresh one workspace tree while preserving selection and expansion state.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {{ keepSelection?: boolean }} [options]
     * @returns {Promise<void>}
     */
    async function refreshWorkspaceTreePanel(nodeEntry, state, options = {}) {
      const keepSelection = options.keepSelection !== false;
      const nextSelection = keepSelection ? state.selectedRelativePath : '';
      resetWorkspaceTreeState(state);
      state.selectedRelativePath = normalizeWorkspaceRelativePath(nextSelection);
      updateWorkspaceTreeFooter(nodeEntry, state);
      renderWorkspaceTreePanel(nodeEntry, state.workspaceKey, state.cwd);
      await syncWorkspaceTreeClipboardState(nodeEntry, state);
      await loadWorkspaceTreeDirectory(nodeEntry, state, '');
    }

    /**
     * Close the current workbench document for one workspace.
     *
     * @param {object} state
     * @param {string} [message]
     * @returns {void}
     */
    function closeWorkspaceDocument(state, message = '') {
      state.activeRelativePath = '';
      state.document = null;
      state.draftContent = '';
      state.lastSavedContent = '';
      state.dirty = false;
      state.loading = false;
      state.saving = false;
      state.compiling = false;
      state.error = '';
      state.statusMessage = message;
      state.previewMode = 'edit';
      state.pdfView = {
        page: 1,
        pageCount: null,
        zoom: 100,
      };
      state.texCompileResult = null;
    }

    /**
     * Persist the current editable document when needed.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @returns {Promise<boolean>}
     */
    async function saveWorkspaceDocument(nodeEntry, state) {
      if (!state.document?.isEditable || !state.activeRelativePath) return false;
      if (!state.dirty && !state.saving) return true;

      state.saving = true;
      state.error = '';
      state.statusMessage = `Saving ${state.activeRelativePath}...`;
      refreshWorkspaceDocumentUiState(nodeEntry, state);

      try {
        const result = await window.sessionsAPI.writeWorkspaceDocument({
          cwd: state.cwd,
          relativePath: state.activeRelativePath,
          content: state.draftContent,
        });
        state.lastSavedContent = state.draftContent;
        state.dirty = false;
        state.saving = false;
        state.document = {
          ...state.document,
          updatedAt: result?.updatedAt || Date.now(),
          size: result?.size ?? state.document.size,
          content: state.draftContent,
        };
        state.statusMessage = `Saved ${state.activeRelativePath}`;
        state.error = '';
        renderWorkspaceDocumentPanel(nodeEntry, state.workspaceKey, state.cwd);
        return true;
      } catch (error) {
        state.saving = false;
        state.error = error?.message || String(error);
        refreshWorkspaceDocumentUiState(nodeEntry, state);
        return false;
      }
    }

    /**
     * Build the iframe URL for PDF-like previews.
     *
     * @param {string} fileUrl
     * @param {{ page: number, zoom: number }} pdfView
     * @returns {string}
     */
    function buildWorkspacePdfViewerUrl(fileUrl, pdfView) {
      const page = Math.max(1, Number(pdfView?.page || 1));
      const zoom = Math.max(50, Math.min(250, Number(pdfView?.zoom || 100)));
      return `${fileUrl}#page=${page}&zoom=${zoom}`;
    }

    /**
     * Open one file inside the embedded workbench.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {string} relativePath
     * @param {{ force?: boolean }} [options]
     * @returns {Promise<void>}
     */
    async function openWorkspaceDocument(nodeEntry, state, relativePath, options = {}) {
      const normalizedPath = normalizeWorkspaceRelativePath(relativePath);
      if (!normalizedPath) return;
      if (state.activeRelativePath === normalizedPath && state.document && !options.force) return;

      if (state.dirty && state.activeRelativePath && state.activeRelativePath !== normalizedPath) {
        const confirmed = window.confirm(`Discard unsaved changes in "${state.activeRelativePath}"?`);
        if (!confirmed) return;
      }

      state.loading = true;
      state.saving = false;
      state.compiling = false;
      state.error = '';
      state.statusMessage = `Opening ${normalizedPath}...`;
      state.activeRelativePath = normalizedPath;
      renderWorkspaceDocumentPanel(nodeEntry, state.workspaceKey, state.cwd);

      try {
        const documentPayload = await window.sessionsAPI.readWorkspaceDocument({
          cwd: state.cwd,
          relativePath: normalizedPath,
        });
        state.document = documentPayload;
        state.activeRelativePath = documentPayload.relativePath;
        state.draftContent = documentPayload.content || '';
        state.lastSavedContent = state.draftContent;
        state.dirty = false;
        state.loading = false;
        state.previewMode = documentPayload.mode === 'pdf' ? 'pdf' : 'edit';
        state.pdfView = {
          page: 1,
          pageCount: documentPayload.pdf?.pageCount || null,
          zoom: 100,
        };
        state.texCompileResult = null;
        state.statusMessage = `Opened ${documentPayload.relativePath}`;
        state.error = '';
      } catch (error) {
        closeWorkspaceDocument(state, '');
        state.error = error?.message || String(error);
      }

      renderWorkspaceDocumentPanel(nodeEntry, state.workspaceKey, state.cwd);
    }

    /**
     * Update the draft content and workbench chrome from one textarea input event.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {HTMLTextAreaElement} textarea
     * @param {HTMLElement | null} gutterEl
     * @returns {void}
     */
    function handleWorkspaceEditorInput(nodeEntry, state, textarea, gutterEl) {
      state.draftContent = textarea.value;
      state.dirty = state.draftContent !== state.lastSavedContent;
      if (state.document) {
        state.document.content = state.draftContent;
      }
      syncWorkspaceEditorGutter(gutterEl, state.draftContent);
      refreshWorkspaceDocumentUiState(nodeEntry, state);
    }

    /**
     * Compile the active TeX document and switch to the generated PDF preview.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @returns {Promise<void>}
     */
    async function compileWorkspaceDocument(nodeEntry, state) {
      if (state.document?.mode !== 'tex' || !state.activeRelativePath) return;
      const saved = await saveWorkspaceDocument(nodeEntry, state);
      if (!saved) return;

      state.compiling = true;
      state.error = '';
      state.statusMessage = `Compiling ${state.activeRelativePath}...`;
      renderWorkspaceDocumentPanel(nodeEntry, state.workspaceKey, state.cwd);

      try {
        const result = await window.sessionsAPI.compileWorkspaceTexDocument({
          cwd: state.cwd,
          relativePath: state.activeRelativePath,
        });
        state.compiling = false;
        state.texCompileResult = result;
        state.previewMode = 'preview';
        state.pdfView = {
          page: 1,
          pageCount: result?.pageCount || null,
          zoom: 100,
        };
        state.statusMessage = `Compiled ${result?.outputRelativePath || state.activeRelativePath}`;
        state.error = '';
      } catch (error) {
        state.compiling = false;
        state.error = error?.message || String(error);
      }

      renderWorkspaceDocumentPanel(nodeEntry, state.workspaceKey, state.cwd);
    }

    /**
     * Render the tree panel for one workspace.
     *
     * @param {object} nodeEntry
     * @param {string} workspaceKey
     * @param {string} cwd
     * @returns {void}
     */
    function renderWorkspaceTreePanel(nodeEntry, workspaceKey, cwd, options = {}) {
      if (!nodeEntry?.treePanel || !nodeEntry?.treeViewport || !nodeEntry?.treeRefreshBtn) return;

      const state = ensureWorkspaceTreeState(workspaceKey, cwd);
      const deferLoad = !!options.deferLoad;
      if (nodeEntry.expandedShell) {
        nodeEntry.expandedShell.style.gridTemplateColumns = cwd ? '' : '1fr';
      }
      if (nodeEntry.treePanel) {
        nodeEntry.treePanel.hidden = !cwd;
      }
      nodeEntry.treeRefreshBtn.disabled = !cwd;
      nodeEntry.treeNewFileBtn.disabled = !cwd;
      nodeEntry.treeNewFolderBtn.disabled = !cwd;

      if (!cwd) {
        nodeEntry.treeViewport.replaceChildren(createTreeEmptyState('No workspace folder is available.'));
        updateWorkspaceTreeFooter(nodeEntry, state);
        return;
      }

      const snapshot = getWorkspaceTreeDirectory(state, '');
      if (!snapshot && !state.loadingPaths.has('')) {
        if (deferLoad) {
          nodeEntry.treeViewport.replaceChildren(createTreeEmptyState('Expand the workspace to load its files.'));
        } else {
          void loadWorkspaceTreeDirectory(nodeEntry, state, '');
          nodeEntry.treeViewport.replaceChildren(createTreeEmptyState('Loading workspace tree...'));
        }
        updateWorkspaceTreeFooter(nodeEntry, state);
        return;
      }

      const viewport = document.createElement('div');
      viewport.className = 'workspace-tree-root';
      renderWorkspaceTreeDirectory(nodeEntry, state, viewport, '', 0);
      if (viewport.childNodes.length === 0) {
        viewport.appendChild(createTreeEmptyState(state.lastError || 'This workspace folder is empty.'));
      }
      nodeEntry.treeViewport.replaceChildren(viewport);
      updateWorkspaceTreeFooter(nodeEntry, state);
      void syncWorkspaceTreeClipboardState(nodeEntry, state);
      if (!deferLoad && !snapshot?.loaded && !state.loadingPaths.has('')) {
        void loadWorkspaceTreeDirectory(nodeEntry, state, '');
      }
    }

    /**
     * Render one tree directory recursively.
     *
     * @param {object} nodeEntry
     * @param {object} state
     * @param {HTMLElement} container
     * @param {string} relativePath
     * @param {number} depth
     * @returns {void}
     */
    function renderWorkspaceTreeDirectory(nodeEntry, state, container, relativePath, depth) {
      const snapshot = getWorkspaceTreeDirectory(state, relativePath);
      if (!snapshot) {
        const placeholder = document.createElement('div');
        placeholder.className = 'workspace-tree-empty';
        placeholder.textContent = state.loadingPaths.has(relativePath) ? 'Loading...' : 'Expand to load this folder.';
        container.appendChild(placeholder);
        if (!state.loadingPaths.has(relativePath)) {
          void loadWorkspaceTreeDirectory(nodeEntry, state, relativePath);
        }
        return;
      }

      if (snapshot.error) {
