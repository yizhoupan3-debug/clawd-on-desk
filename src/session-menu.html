<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root {
  --bg: #121214;
  --fg: #e1e1e6;
  --gray: #8d8d99;
  --border: rgba(255, 255, 255, 0.1);
  --hover: rgba(255, 255, 255, 0.05);
  --accent: #de886d;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  overscroll-behavior: none;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 0;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  user-select: none;
}

.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--gray);
  padding: 8px 16px 6px;
  letter-spacing: 0.06em;
}

.item {
  display: flex;
  align-items: center;
  padding: 8px 16px;
  cursor: pointer;
  transition: background 0.2s ease;
  position: relative;
}

.item:hover {
  background: var(--hover);
}

.item-icon {
  width: 16px;
  height: 16px;
  margin-right: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gray);
}

.status-working { background: #50fa7b; box-shadow: 0 0 8px #50fa7b; }
.status-thinking { background: #8be9fd; box-shadow: 0 0 8px #8be9fd; }
.status-idle { background: #f1fa8c; }

.item-label {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
  letter-spacing: 0.2px;
  color: rgba(225, 225, 230, 0.95);
}

.item-sub {
  font-size: 11px;
  color: rgba(141, 141, 153, 0.8);
  margin-left: 8px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.2px;
}

.separator {
  height: 1px;
  background: var(--border);
  margin: 8px 0;
}

.empty-state {
  padding: 12px 16px;
  color: var(--gray);
  font-style: italic;
  font-size: 12px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="session-section">
  <div class="section-title" id="t-sessions">Sessions</div>
  <div id="session-list"></div>
</div>

<div class="separator"></div>

<div id="model-section">
  <div class="section-title" id="t-models">New Thread</div>
  <div id="model-list"></div>
</div>

<script>
const sessionList = document.getElementById("session-list");
const modelList = document.getElementById("model-list");

/**
 * Render the menu empty state.
 *
 * @param {HTMLElement} container
 * @param {string} text
 * @returns {void}
 */
function renderEmptyState(container, text) {
  const empty = document.createElement("div");
  empty.className = "empty-state";
  empty.textContent = text;
  container.replaceChildren(empty);
}

/**
 * Build one clickable menu item with safe text nodes.
 *
 * @param {{ iconText?: string, statusClass?: string, label: string, subLabel?: string, onClick: () => void }} options
 * @returns {HTMLDivElement}
 */
function createItem(options) {
  const item = document.createElement("div");
  item.className = "item";

  const icon = document.createElement("div");
  icon.className = "item-icon";
  if (options.statusClass) {
    const dot = document.createElement("div");
    dot.className = `status-dot ${options.statusClass}`;
    icon.appendChild(dot);
  } else {
    icon.textContent = options.iconText || "";
  }

  const label = document.createElement("div");
  label.className = "item-label";
  label.textContent = options.label;

  item.append(icon, label);

  if (options.subLabel) {
    const sub = document.createElement("div");
    sub.className = "item-sub";
    sub.textContent = options.subLabel;
    item.appendChild(sub);
  }

  item.onclick = options.onClick;
  return item;
}

window.sessionAPI.onUpdate((data) => {
  const { lang, sessions, models, t } = data;
  
  // Update translation keys
  document.getElementById("t-sessions").textContent = t.sessions;
  document.getElementById("t-models").textContent = t.newThread || "New Thread";

  // Render Sessions
  sessionList.replaceChildren();
  if (sessions.length === 0) {
    renderEmptyState(sessionList, t.noSessions);
  } else {
    const fragment = document.createDocumentFragment();
    sessions.forEach(s => {
      fragment.appendChild(createItem({
        statusClass: `status-${String(s.state || "").toLowerCase()}`,
        label: s.label,
        subLabel: s.time,
        onClick: () => window.sessionAPI.selectSession(s.id)
      }));
    });
    sessionList.replaceChildren(fragment);
  }

  // Render Models
  const modelFragment = document.createDocumentFragment();
  models.forEach(m => {
    modelFragment.appendChild(createItem({
      iconText: "⚡",
      label: m.name,
      onClick: () => window.sessionAPI.newThread(m.id)
    }));
  });
  modelList.replaceChildren(modelFragment);

  // Report height for window sizing
  requestAnimationFrame(() => {
    const h = document.body.offsetHeight;
    window.sessionAPI.reportHeight(h);
  });
});

// Close menu if clicking outside is handled by main process blur
</script>
</body>
</html>
